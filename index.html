<style>
:root{--p:#4C3494;--p2:#6D4FD1;--p3:#EDE8FB;--bg:#F3F1F9;--card:#fff;--tx:#1E1A33;--mu:#7C7896;--ok:#1FA971;--warn:#F5A524;--bad:#E5484D;--line:#E8E5F2;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14111F;--card:#201B33;--tx:#F1EEFB;--mu:#9B96B8;--line:#2E2848;--p3:#2E2650}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overscroll-behavior:none;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#app{max-width:480px;height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
/* login */
.logo{width:76px;height:76px;border-radius:24px;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 10px 30px #0004}
.btn{width:100%;height:52px;border-radius:16px;background:var(--p);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:var(--p3);color:var(--p2)}
.hint{text-align:center;font-size:12px;color:var(--mu);margin-top:12px}
/* shell */
.scr{position:absolute;inset:0;overflow-y:auto;padding-bottom:calc(84px + var(--sab));-webkit-overflow-scrolling:touch}
.top{background:linear-gradient(170deg,var(--p),#3A2578);color:#fff;padding:calc(var(--sat) + 16px) 20px 76px;border-radius:0 0 28px 28px}
.top.small{padding-bottom:26px}
.row{display:flex;align-items:center;justify-content:space-between}
.hi{font-size:13px;opacity:.8}.nm{font-size:19px;font-weight:700}
.av{width:42px;height:42px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:20px}
.title{font-size:22px;font-weight:700;margin-top:6px}
.wallet{margin:-56px 16px 0;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 24px #4C349426;position:relative}
.wallet small{color:var(--mu);font-size:12px}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:2px 0 14px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.ic{width:46px;height:46px;border-radius:15px;background:var(--p3);display:grid;place-items:center;font-size:22px}
.sec{padding:0 16px;margin-top:22px}
.sec h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-align:center;line-height:1.25;font-weight:500}
.grid .ic{width:52px;height:52px;border-radius:17px;font-size:24px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .ic{width:40px;height:40px;border-radius:13px;font-size:18px;flex:none}
.li .b{flex:1;min-width:0}.li b{display:block;font-size:14.5px}.li span{font-size:12.5px;color:var(--mu)}
.amt{font-weight:700;font-size:14.5px}.pos{color:var(--ok)}.neg{color:var(--bad)}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--p3);color:var(--p2)}
.chip.ok{background:#1FA97120;color:var(--ok)}.chip.warn{background:#F5A52426;color:#B97800}.chip.bad{background:#E5484D20;color:var(--bad)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--p2)}
.bar.low i{background:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat small{color:var(--mu);font-size:12px}.stat div{font-size:19px;font-weight:800;margin-top:3px}
.chart{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu);gap:6px}
.chart i{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--p2),var(--p))}
.set{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.set:last-child{border:0}
select,.fld{width:100%;height:48px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;background:var(--bg);color:var(--tx);margin:6px 0 12px;user-select:text}
/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(var(--sab) + 6px);z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);font-weight:600;padding:4px 0}
.tabs button span{font-size:22px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--p2)}.tabs button.on span{filter:none;opacity:1}
/* sheet */
.dim{position:absolute;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(var(--sab) + 20px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);z-index:9}
.sheet.on{transform:none}

.qa button:active,.grid button:active{background:var(--card2)}
.ic{width:44px;height:44px;border-radius:14px;background:var(--p3);color:var(--p2);border:1px solid #0E8F6E0F}

.sec{padding:0 16px;margin-top:24px}
.sec h2{font-size:14px;letter-spacing:.01em;font-weight:780;margin:0 0 11px;color:var(--tx)}
.sec h2::after{content:"";display:inline-block;width:18px;height:2px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-left:7px;opacity:.8}

.bar{height:7px;background:var(--card2);margin-top:8px}.bar i{background:linear-gradient(90deg,#39B98F,var(--p2))}.bar.low i{background:var(--bad)}

.tabs button span{width:54px;height:29px;border-radius:15px}
.tabs button.on{color:var(--p2)}
.tabs button.on span{background:var(--p3)}
.tabs button.on::after{content:"";position:absolute}
/* Form controls */
select,.fld{height:50px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:5px 0 11px;color:var(--tx);box-shadow:inset 0 1px 0 #FFFFFF20}
select:focus,.fld:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 4px #0E8F6E16}
/* Sheets */
.dim{background:rgba(7,25,21,.52);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}

/* Toast */
.toast{background:#102C25;color:#F4FAF7;box-shadow:0 10px 28px rgba(0,0,0,.2);font-size:12.5px;padding:11px 17px}

@media(min-width:481px){body{background:#E6ECE8}#app{box-shadow:0 0 0 1px #0F3D3518,0 25px 70px rgba(15,61,53,.16)}}

/* ===== MA-GAMBRENG SIGNATURE ELITE — v11 ===== */
:root{
 --bg:#F7F6F1;--card:#FFFFFF;--card2:#F0F4EF;--tx:#17342D;--mu:#74827C;--line:#E1E6E0;

}

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#ECEDE8!important;color:var(--tx);letter-spacing:-.01em}

/* No generic colored banner: editorial brand header */
.lux-head,.lux-home-head{position:relative;padding:calc(var(--sat) + 13px) 18px 12px;background:rgba(247,246,241,.96);border-bottom:1px solid var(--line);box-shadow:0 5px 18px rgba(21,52,45,.035);z-index:2}
.lux-brand,.lux-home-brand{display:flex;align-items:center;gap:12px;min-height:54px}

/* Signature revenue card */
.lux-revenue{position:relative;margin:14px 16px 0;padding:18px 18px 13px;border-radius:23px;background:linear-gradient(145deg,#0B5B49 0%,#0D6955 55%,#0A4F40 100%);color:#fff;box-shadow:0 18px 42px rgba(11,91,73,.20);overflow:hidden}

.lux-revenue-foot{margin-top:18px;padding-top:10px;border-top:1px solid #FFFFFF1A;font-size:9.5px;color:#B6D4CA}.lux-revenue-foot span:last-child{color:#E8D79F}

.lux-section{margin:20px 16px 0}.lux-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:9px}.lux-section-head h2{margin:4px 0 0;font-size:17px;letter-spacing:-.035em;font-weight:820}.lux-count{font-size:9px;color:var(--mu)}.lux-text-btn{font-size:10px;font-weight:750;color:#0B7059;padding:3px 0}

.lux-ops,.lux-alert{border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:var(--lux-shadow-sm);overflow:hidden}
.lux-op{width:100%;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:9px;padding:12px 13px;border-bottom:1px solid #EDF0EC;text-align:left}.lux-op:last-child{border-bottom:0}.lux-op-dot{width:7px;height:7px;border-radius:50%;background:#C7CECA}.lux-op-dot.on{background:#18A77F;box-shadow:0 0 0 4px #18A77F18}.lux-op span:nth-child(2){min-width:0}.lux-op b,.lux-op small{display:block}.lux-op b{font-size:11.5px}.lux-op small{font-size:9.5px;color:var(--mu);margin-top:2px}.lux-op strong{font-size:10.5px;font-variant-numeric:tabular-nums}
.lux-alert-row{width:100%;display:grid;grid-template-columns:30px 1fr 15px;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid #EDF0EC;text-align:left}.lux-alert-row:last-child{border-bottom:0}.lux-alert-icon{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:12px;background:#FBF0D8;color:#A77919}.lux-alert-icon.bad{background:#FBE7E8;color:#C9444B}.lux-alert-row b,.lux-alert-row small{display:block}.lux-alert-row b{font-size:10.5px}.lux-alert-row small{font-size:9px;color:var(--mu);margin-top:2px}.lux-alert-row em{font-style:normal;color:#A2ACA7;font-size:18px}
/* Page headers no longer consume huge colored area */
.page-top + .sec,.page-top + .kpi-hero,.page-top + .report-hero{margin-top:14px}

/* ===== SIGNATURE 8s SPLASH SCREEN — cinematic brand reveal ===== */
#app{opacity:1;}
body.splash-active{overflow:hidden!important;}
#elite-splash{
  position:fixed;inset:0;z-index:99999;overflow:hidden;display:grid;place-items:center;
  background:#18A77F;color:#fff;isolation:isolate;
  opacity:1;visibility:visible;pointer-events:auto;
  animation:splashExit 520ms cubic-bezier(.4,0,.2,1) 7680ms forwards;
}
#elite-splash::before{
  content:"";position:absolute;inset:-20%;z-index:-2;
  background:
    radial-gradient(circle at 50% 28%,rgba(255,255,255,.18),transparent 26%),
    radial-gradient(circle at 12% 88%,rgba(5,76,60,.16),transparent 30%),
    radial-gradient(circle at 90% 12%,rgba(255,226,146,.10),transparent 24%),
    linear-gradient(145deg,#1AB08A 0%,#159A78 52%,#0D8165 100%);
  animation:splashBgDrift 8s ease-in-out both;
}
#elite-splash::after{
  content:"";position:absolute;inset:0;z-index:-1;opacity:.12;
  background-image:radial-gradient(rgba(255,255,255,.8) .65px,transparent .65px);
  background-size:18px 18px;
  mask-image:linear-gradient(to bottom,transparent,black 22%,black 78%,transparent);
}
.splash-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:24px;}
.splash-intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;z-index:2;}
.splash-welcome,.splash-owner{opacity:0;transform:translateY(16px);text-shadow:0 10px 34px rgba(0,62,49,.18);}
.splash-welcome{font-size:clamp(30px,8.5vw,44px);font-weight:500;letter-spacing:-.045em;animation:splashTextIn 950ms cubic-bezier(.22,1,.36,1) 450ms forwards;}
.splash-owner{font-size:clamp(16px,4.7vw,22px);font-weight:760;letter-spacing:.11em;text-transform:uppercase;animation:splashTextIn 950ms cubic-bezier(.22,1,.36,1) 1150ms forwards;}
.splash-wash{position:absolute;inset:0;background:linear-gradient(160deg,#F0FBF5 0%,#E2F5EA 52%,#D4EEE0 100%);opacity:0;z-index:4;animation:splashWash 1250ms cubic-bezier(.65,0,.35,1) 2350ms forwards;}
.splash-brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;z-index:5;animation:splashBrandIn 900ms cubic-bezier(.2,.8,.2,1) 3200ms forwards;}
.splash-coin-wrap{position:relative;display:grid;place-items:center;transform:translateY(-8px);}
.splash-coin{width:clamp(148px,38vw,190px);height:clamp(148px,38vw,190px);border-radius:50%;padding:7px;background:linear-gradient(145deg,#FFF0B4 0%,#E0B957 34%,#B88728 67%,#F1D57D 100%);box-shadow:0 28px 70px rgba(48,79,61,.22),0 3px 0 rgba(255,255,255,.82) inset,0 -5px 14px rgba(91,64,20,.14) inset;transform-style:preserve-3d;animation:coinSpin 3000ms cubic-bezier(.16,.82,.24,1) 3500ms both;}
.splash-coin::before{content:"";position:absolute;inset:7px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),inset 0 -8px 18px rgba(95,65,17,.10);pointer-events:none;z-index:4;}
.splash-coin-inner{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);transform-style:preserve-3d;}
.splash-coin img{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;object-fit:contain;backface-visibility:hidden;-webkit-backface-visibility:hidden;}

.splash-title{margin-top:28px;color:#155A48;font-size:clamp(23px,6.2vw,32px);font-weight:790;letter-spacing:-.04em;opacity:0;transform:translateY(13px);animation:splashTitleIn 850ms cubic-bezier(.22,1,.36,1) 5750ms forwards;}
.splash-caption{margin-top:8px;color:#6B857A;font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:0;transform:translateY(6px);animation:splashCaptionIn 650ms cubic-bezier(.22,1,.36,1) 6450ms forwards;}
.splash-rule{width:0;height:1px;margin-top:14px;background:linear-gradient(90deg,transparent,#C7A34E,transparent);animation:splashRuleIn 700ms ease 6600ms forwards;}
.splash-credit{position:absolute;left:24px;right:24px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:5px;color:#789188;opacity:0;transform:translateY(8px);animation:splashCreditIn 900ms cubic-bezier(.22,1,.36,1) 7100ms forwards;}

@keyframes splashCreditIn{to{opacity:1;transform:translateY(0)}}
@keyframes splashTextIn{to{opacity:1;transform:translateY(0)}}
@keyframes splashWash{0%{opacity:0;transform:scale(1.02)}55%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}

.highlight-card.highlight-revenue::before{background:#C39128}

:root{

}

/* Larger, cleaner brand mark — more presence without creating a logo box */
.owner-brand-lockup{gap:11px}
.owner-logo{width:54px;height:54px;flex-basis:54px}

.owner-clock-block span{font-size:9px}

/* ===== Floating glass navigation dock ===== */
.tabs{
  left:12px;right:12px;bottom:calc(var(--sab) + 10px);
  height:70px;padding:5px;
  border:1px solid rgba(255,255,255,.82);
  border-radius:22px;
  grid-template-columns:repeat(4,1fr);gap:3px;
  background:rgba(250,253,251,.91)!important;
  box-shadow:0 16px 38px rgba(23,72,59,.14),0 3px 10px rgba(23,72,59,.06),inset 0 1px 0 rgba(255,255,255,.98)!important;

  width:34px;height:28px;border-radius:11px;
  font-size:21px;opacity:.72;
  background:transparent!important;box-shadow:none!important;
  transition:transform .22s ease,background .22s ease,opacity .22s ease;
}
.tabs button.on{
  color:#087457!important;
  background:transparent!important;
  box-shadow:none!important;
}

  transform:translateY(-1px);
  box-shadow:inset 0 0 0 1px rgba(11,128,100,.08)!important;

.tabs button.on::after{display:none}

<script>

/* ===== Data demo (ganti dengan API Supabase) ===== */

/* ===== DATA SISTEM =====
   No operational mock/seed/demo data is stored in this client.
   All business facts come from Supabase after authentication.
*/
const SUPABASE_URL = window.__SUPABASE_CONFIG?.url || '';
const SUPABASE_PUBLISHABLE_KEY = window.__SUPABASE_CONFIG?.publishableKey || '';
const sbClient = (window.supabase && SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;

const rp=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const waHref=v=>{const n=String(v||'').replace(/\D/g,'');return n?`https://wa.me/${n}`:''};

let gerai=[];
let menu=[];
let stok=[];
let audit=[];
let total=0;
let totalTransactions=0;
let hpp=0;
let bersih=0;
let topMenu=['—',0];
let state={
  header:null,
  spg:[],
  checker:[],
  sessions:[],
  storeSales:[],
  payments:[],
  notifications:[],
  bills:[],
  transactions:[],
  iceOrders:[],
  restocks:[],
  moneyTimeline:[],
  inventoryMovements:[]
};
let ownerCrud={gerai:[],spg:[],checker:[],menu:[],logistik:[],esKristal:[]};
let ownerMoments=[];
let highlightIndex=0;
let highlightTimer=null;
let realtimeChannel=null;

function todayJakarta(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function statusLabel(v){
  const s=String(v||'').toLowerCase();
  return ['active','aktif','open','buka','received','completed','approved','final','ok'].includes(s)?'Aktif':
         ['inactive','nonaktif','suspended','closed','tutup','cancelled','rejected','failed'].includes(s)?'Nonaktif':
         String(v||'—');
}
function asArray(v){return Array.isArray(v)?v:[]}
function rowsFromJson(v){
  if(Array.isArray(v)) return v;
  if(v && Array.isArray(v.rows)) return v.rows;
  if(v && Array.isArray(v.data)) return v.data;
  return [];
}
async function rpc(name,args={}){
  const {data,error}=await sbClient.rpc(name,args);
  if(error) throw error;
  return data;
}
async function selectRows(table, queryFn){
  let q=sbClient.from(table).select('*');
  if(queryFn) q=queryFn(q);
  const {data,error}=await q;
  if(error) throw error;
  return data||[];
}
const safeLoad=(p,fb=[])=>Promise.resolve(p).catch(e=>{console.error('Data pendukung gagal dimuat:',e);return fb});
function mapGerai(stores,sessions){
  const bySession=new Map(asArray(sessions).map(x=>[x.store_id,x]));
  return asArray(stores).map(s=>({
    id:s.id,nama:s.name,alamat:s.address||'',telepon:s.phone||'',
    status:s.status,slug:s.slug||'',pwa_url:s.pwa_url||'',
    ice_qr_image_url:s.ice_qr_image_url||'',
    spg:'',session:bySession.get(s.id)||null
  }));
}
function syncGeraiCrud(){
  ownerCrud.gerai=gerai.map(g=>({id:g.id,nama:g.nama,alamat:g.alamat,telepon:g.telepon,status:statusLabel(g.status),slug:g.slug,pwa_url:g.pwa_url,ice_qr_image_url:g.ice_qr_image_url,buka:!!g.session}));
}
async function geraiReload(){
  // Sama seperti teamReload: baca langsung dari server saat kartu dibuka.
  const [stores,sessions]=await Promise.all([
    selectRows('stores',q=>q.order('created_at',{ascending:true})),
    safeLoad(selectRows('store_operation_sessions',q=>q.eq('status','open')))
  ]);
  state.sessions=sessions;
  gerai=mapGerai(stores,sessions);
  syncGeraiCrud();
  const t=document.querySelector('[data-o="gerai"] small');
  if(t)t.textContent=`${gerai.length} gerai`;
}
function mapMenuStok(menus,consumptions,inventory){
  const compositionByMenu=new Map();
  for(const c of asArray(consumptions)){
    const list=compositionByMenu.get(c.menu_id)||[];
    list.push({inventory_item_id:c.inventory_item_id,quantity_per_sale:Number(c.quantity_per_sale||0)});
    compositionByMenu.set(c.menu_id,list);
  }
  menu=asArray(menus).map(m=>({
    id:m.id,nama:m.name,kategori:m.category||'',harga:Number(m.price||0),hpp:Number(m.hpp||0),
    status:m.status,komposisi:compositionByMenu.get(m.id)||[]
  }));
  stok=asArray(inventory).map(x=>({
    id:x.id,nama:x.name,satuan:x.unit||'',stok:Number(x.stock||0),
    minimum:Number(x.minimum_stock||0),supplier:x.supplier||'',
    logistics_type:x.logistics_type||'passive',status:x.status
  }));
}
function syncMenuCrud(){
  ownerCrud.menu=menu.map(m=>({id:m.id,nama:m.nama,kategori:m.kategori,harga:m.harga,hpp:m.hpp,status:statusLabel(m.status),komposisi:m.komposisi||[]}));
  ownerCrud.logistik=stok.map(x=>({id:x.id,nama:x.nama,satuan:x.satuan,stok:x.stok,minimum:x.minimum,supplier:x.supplier,logistics_type:x.logistics_type,status:statusLabel(x.status)}));
}
async function menuReload(){
  // Sama seperti teamReload/geraiReload: baca langsung dari server saat kartu dibuka.
  const [menus,consumptions,inventory]=await Promise.all([
    selectRows('menus',q=>q.order('name',{ascending:true})),
    selectRows('menu_inventory_consumptions',q=>q.order('created_at',{ascending:true})),
    selectRows('inventory_items',q=>q.order('name',{ascending:true}))
  ]);
  mapMenuStok(menus,consumptions,inventory);
  syncMenuCrud();
  const t=document.querySelector('[data-o="set-menu"] small');
  if(t)t.textContent=`${menu.length} menu`;
}
async function loadServerState(){
  const salesLatestP=safeLoad(rpc('owner_list_sales_report_dates',{p_limit:1}),null);
  const [header,stores,menus,inventory,consumptions,spg,checker,notifs,bills,transactions,iceOrders,restocks,auditRows,money] = await Promise.all([
    rpc('owner_get_header_context'),
    selectRows('stores',q=>q.order('created_at',{ascending:true})),
    selectRows('menus',q=>q.order('name',{ascending:true})),
    selectRows('inventory_items',q=>q.order('name',{ascending:true})),
    selectRows('menu_inventory_consumptions',q=>q.order('created_at',{ascending:true})),
    rpc('owner_list_members',{p_role:'spg'}),
    rpc('owner_list_members',{p_role:'checker'}),
    safeLoad(selectRows('user_notifications',bellQuery)),
    safeLoad(selectRows('owner_bills',q=>q.order('created_at',{ascending:false}).limit(500))),
    safeLoad(selectRows('monitoring_daily_transactions',q=>q.eq('sales_date',todayJakarta()).order('occurred_at',{ascending:false}).limit(100))),
    safeLoad(selectRows('ice_orders',q=>q.order('created_at',{ascending:false}).limit(50))),
    safeLoad(selectRows('store_restock_requests',q=>q.order('created_at',{ascending:false}).limit(50))),

// Debounce event realtime agar rentetan perubahan hanya memicu satu fetch ulang.
let _rtTimer=null,_rtDown=false;
function refreshAndDrawDebounced(){clearTimeout(_rtTimer);_rtTimer=setTimeout(refreshAndDraw,400)}
if(!window.__ownerSyncBound){
  window.__ownerSyncBound=true;
  // Fallback polling ±60 dtk, resync saat aplikasi aktif kembali / internet pulih.
  setInterval(()=>{if(!document.hidden&&navigator.onLine&&realtimeChannel)refreshAndDraw()},60000);
  window.addEventListener('online',()=>{if(realtimeChannel)refreshAndDraw()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&realtimeChannel)refreshAndDraw()});
}
function startRealtime(){
  if(realtimeChannel) sbClient.removeChannel(realtimeChannel);
  const refreshAndDraw=refreshAndDrawDebounced;
  realtimeChannel=sbClient.channel('owner-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'stores'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'menus'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'inventory_items'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'monitoring_daily_transactions'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'store_operation_sessions'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'user_notifications'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'audit_logs'},refreshAndDraw)
    .on('postgres_changes',{event:'*',schema:'public',table:'owner_bills'},refreshAndDraw)
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){if(_rtDown){_rtDown=false;refreshAndDrawDebounced()}}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){_rtDown=true}
    });
}

function crudActionHandler(e){
 e.preventDefault();e.stopPropagation();
 const b=e.currentTarget||e.target.closest('[data-crud-action]');if(!b)return;
 const a=b.dataset.crudAction,k=b.dataset.k,id=b.dataset.id;
 if(a==='add')return crudForm(k);
 if(a==='detail')return crudDetail(k,id);
 if(a==='gerai-link')return showGeraiLinkPopup(id,{after:'detail'});
 if(a==='edit')return crudForm(k,id);
 if(a==='delete')return crudConfirmDelete(k,id,1);
 if(a==='save')return crudReview(k,id);
 if(a==='review-back'){window.__restoreDraft=true;return crudForm(k,id)}
 if(a==='save-confirm')return crudSave(k,id);
 if(a==='delete-next')return crudConfirmDelete(k,id,2);
 if(a==='delete-confirm')return crudDelete(k,id);
 if(a==='delete-cancel')return crudDetail(k,id);
 if(a==='back-list')return crudBackToList(k);

 if(a==='remove-comp'){b.closest('.crud-comp-row')?.remove();return;}
}

function collectCrudDraft(k,id){
 const get=n=>$('#cf-'+n)?.value.trim()||'';

 const status=document.querySelector('input[name="cf-status"]:checked')?.value||'Aktif';
 const r={id:id||k.slice(0,1)+Date.now(),status};
 if(k==='gerai')Object.assign(r,{nama:get('nama'),alamat:get('alamat'),telepon:prevTel});
 if(k==='spg')Object.assign(r,{nama:get('nama'),telepon:prevTel,access_code:get('access_code')});
 if(k==='checker')Object.assign(r,{nama:get('nama'),telepon:prevTel,access_code:get('access_code')});
 if(k==='menu'){
  Object.assign(r,{nama:get('nama'),kategori:get('kategori'),harga:Number(get('harga')||0),hpp:Number(get('hpp')||0)});
  r.komposisi=[...document.querySelectorAll('.crud-comp-row')].map(row=>({inventory_item_id:row.querySelector('.comp-item')?.value,quantity_per_sale:Number(row.querySelector('.comp-qty')?.value||1)})).filter(x=>x.inventory_item_id&&x.quantity_per_sale>0);
 }
 if(k==='logistik')Object.assign(r,{nama:get('nama'),satuan:get('satuan'),stok:Number(get('stok')||0),minimum:Number(get('minimum')||0),supplier:get('supplier'),logistics_type:$('#cf-logistics_type')?.value||'passive'});
 if(k==='esKristal')Object.assign(r,{nama:get('nama'),perusahaan:get('perusahaan'),telepon:get('telepon'),catatan:get('catatan')});
 return r;
}

function friendlyError(e,fallback){
 const raw=String(e?.message||e||'').trim();
 const low=raw.toLowerCase();
 const code=raw.split(':')[0].trim();
 if(ERR_TEXT[code]) return ERR_TEXT[code];
 if(/failed to fetch|networkerror|load failed|network request failed/.test(low)) return 'Koneksi terputus. Periksa internet Anda lalu coba lagi.';
 if(/invalid login|invalid credentials/.test(low)) return 'Kode akses tidak sesuai.';
 if(/jwt|not authenticated|session/.test(low)) return 'Sesi Anda sudah berakhir. Silakan masuk kembali.';
 if(raw && /\s/.test(raw) && /^[A-Z]/.test(raw) && !/(error|failed|violat|jwt|supabase|postgres|function|rpc|constraint|relation|column|permission|policy|edge|non-2xx|undefined|null)/i.test(raw)) return raw;
 return fallback||'Terjadi kendala. Silakan coba lagi.';
}
function fmtWaktu(v){
 if(!v) return '—';
 try{return new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch(_){return '—'}
}
const AUD_ACTION={create:'ditambahkan',update:'diubah',set_status:'status diubah',status_change:'status diubah',logistics_type_change:'jenis logistik diubah',delete:'dihapus permanen'};
const AUD_ENTITY={announcement:'Pengumuman',store:'Gerai',menu:'Menu',inventory_item:'Item logistik',spg:'SPG',checker:'Checker',ice_whatsapp_contact:'Kontak es kristal',ice_invoice:'Invoice es kristal'};

const REP_LABEL={store_name:'Gerai',store:'Gerai',menu_name:'Menu',menu:'Menu',name:'Nama',quantity:'Jumlah',qty:'Jumlah',total:'Total',total_sales:'Total penjualan',total_amount:'Total',amount:'Nilai',price:'Harga',revenue:'Pendapatan',sales_date:'Tanggal',date:'Tanggal',status:'Status',transactions:'Transaksi',transaction_count:'Jumlah transaksi',sold_quantity:'Terjual',cash:'Tunai',qris:'QRIS',payment_method:'Metode bayar',hpp:'HPP',profit:'Laba',category:'Kategori',stock:'Stok',unit:'Satuan',occurred_at:'Waktu',created_at:'Dibuat'};
function repLabel(k){if(REP_LABEL[k])return REP_LABEL[k];const t=String(k).replace(/_/g,' ').trim();return t.charAt(0).toUpperCase()+t.slice(1)}
function repHidden(k){return k==='id'||/_id$/.test(k)}
function repValue(k,v){
 if(v===null||v===undefined||v==='') return '—';
 if(typeof v==='number') return (/amount|price|total|revenue|sales|hpp|cost|profit|income|expense|nilai|omzet|cash|qris/i.test(k)&&!/count|qty|quantity/i.test(k))?rp(v):v.toLocaleString('id-ID');
 if(typeof v==='boolean') return v?'Ya':'Tidak';
 if(typeof v==='object') return '—';
 const t=String(v);
 if(/^\d{4}-\d{2}-\d{2}T/.test(t)) return fmtWaktu(t);
 if(/^(active|inactive|open|closed|completed|cancelled)$/i.test(t)) return statusLabel(t);
 return t;
}
function renderReportData(data){
 const rows=rowsFromJson(data).filter(x=>x&&typeof x==='object');
 let out='';

async function copyText(t){
 try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(_){}
 try{
  const ta=document.createElement('textarea');
  ta.value=t; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length);
  const ok=document.execCommand('copy'); ta.remove(); return ok;
 }catch(_){ return false; }
}

function resolveGeraiLink(row){
 const stored=String(row?.pwa_url||'').trim();
 const slug=String(row?.slug||'').trim().replace(/^\/+|\/+$/g,'');
 if(stored){
  try{
   const url=new URL(stored,location.origin);
   const match=url.pathname.match(/^\/gerai\/([^/]+)\/?$/);
   const linkedSlug=match?decodeURIComponent(match[1]):'';
   if((url.protocol==='https:'||url.protocol==='http:')&&linkedSlug&&(!slug||linkedSlug===slug))return url.href;
  }catch(_){}
 }
 if(!slug)return '';
 return new URL(`/gerai/${encodeURIComponent(slug)}/`,location.origin).href;
}

async function verifyOnServer(k,id,expected){
  // Bukti tersimpan: baca ulang baris dari server (bukan dari state lokal).
  if(!id) throw new Error('Pendaftaran belum dapat dipastikan. Periksa daftar, lalu coba lagi bila data belum muncul.');
   if(k==='esKristal'){
     const rows=asArray(await rpc('owner_list_whatsapp_contacts'));
     const found=rows.find(x=>x.id===id);
     if(!found) throw new Error('Data belum muncul di daftar. Silakan coba lagi.');
     if(expected){
      if(String(found.display_name||'')!==String(expected.nama||'').trim()) throw new Error('Nama kontak belum sesuai dengan data di server.');
      if(expected.status&&found.status!==(expected.status==='Aktif'?'active':'inactive')) throw new Error('Status kontak belum sesuai dengan data di server.');
     }
     return found;
   }
   const columns={gerai:'id,name,address,status,slug,pwa_url',menu:'id,name,price,hpp,status',logistik:'id,name,unit,stock,minimum_stock,supplier,status'}[k]||'id';
   const {data,error}=await sbClient.from(CRUD_VERIFY[k]).select(columns).eq('id',id).maybeSingle();
  if(error) throw error;
  if(!data) throw new Error('Data belum muncul di daftar. Silakan coba lagi.');
   const stat=v=>v==='Aktif'?'active':'inactive';
   if(k==='gerai'&&expected){
    if(String(data.name||'')!==String(expected.nama||'')) throw new Error('Nama gerai belum sesuai dengan data di server.');
    if(String(data.address||'')!==String(expected.alamat||'')) throw new Error('Alamat gerai belum sesuai dengan data di server.');
    if(expected.requireLink&&!resolveGeraiLink(data)) throw new Error('Link operasional belum tersedia dari server. Pastikan gerai memiliki slug yang valid.');
   }
   if(k==='menu'&&expected){
    if(String(data.name||'')!==String(expected.nama||'').trim()) throw new Error('Nama menu belum sesuai dengan data di server.');
    if(Number(data.price)!==Number(expected.harga||0)) throw new Error('Harga menu belum sesuai dengan data di server.');
    if(Number(data.hpp)!==Number(expected.hpp||0)) throw new Error('HPP menu belum sesuai dengan data di server.');
    if(data.status!==stat(expected.status)) throw new Error('Status menu belum sesuai dengan data di server.');
   }
   if(k==='logistik'&&expected){
    if(String(data.name||'')!==String(expected.nama||'').trim()) throw new Error('Nama item belum sesuai dengan data di server.');
    if(Number(data.minimum_stock)!==Number(expected.minimum||0)) throw new Error('Stok minimum belum sesuai dengan data di server.');
    if(!expected.__edit&&Number(data.stock)!==Number(expected.stok||0)) throw new Error('Jumlah logistik belum sesuai dengan data di server.');
    if(expected.status&&data.status!==stat(expected.status)) throw new Error('Status item belum sesuai dengan data di server.');
   }
   return data;
}

 const btns=[...document.querySelectorAll('[data-crud-action="delete-confirm"],[data-crud-action="delete-cancel"]')];
 btns.forEach(b=>b.disabled=true);
 let removed=false;
 try{
   if(navigator.onLine===false) throw new Error('Tidak ada koneksi internet. Data belum dihapus.');
   let res;
   if(k==='gerai') res=await rpc('owner_remove_store',{p_store_id:id});
   else if(k==='menu') res=await rpc('owner_remove_menu',{p_menu_id:id});
   else if(k==='logistik') res=await rpc('owner_remove_inventory_item',{p_inventory_id:id});
   else if(k==='spg'||k==='checker') res=await rpc('owner_remove_member',{p_role:k,p_profile_id:id});
   else if(k==='esKristal') res=await rpc('owner_remove_whatsapp_contact',{p_contact_id:id});
   if(!res||res.ok!==true) throw new Error('Penghapusan belum terkonfirmasi server.');
   removed=true;
   await verifyRemovedOnServer(k,id);
   try{ await loadServerState(); }catch(reloadErr){ console.error(reloadErr); toast('Data sudah terhapus, tetapi daftar belum diperbarui. Buka ulang halaman untuk melihat data terbaru.'); }
   const arsip=Object.values(res.archived||{}).reduce((a,n)=>a+Number(n||0),0);
   sheet(`<div class="crud-confirm"><div class="crud-confirm-icon">✓</div><span class="eyebrow">BERHASIL</span><h3>Data dihapus permanen</h3><p><strong>${esc(r.nama)}</strong> sudah dihapus dari server sampai bersih.${arsip?` ${arsip} catatan riwayat dipindahkan ke Arsip Riwayat.`:' Riwayat dan lognya tetap tersimpan di Arsip Riwayat.'}</p><div class="pg-dock"><button type="button" class="btn" data-crud-action="back-list" data-k="${k}">Kembali ke daftar</button></div></div>`,{title:'Selesai',back:()=>crudBackToList(k)});
   bindCrudActionEvents();
 }catch(e){
   console.error(e);
   toast(removed?'Penghapusan belum dapat dipastikan. Periksa daftar sebelum mencoba lagi.':friendlyError(e,'Data belum dapat dihapus. Coba lagi.'));
   btns.forEach(b=>b.disabled=false);
 }finally{
   __crudDeleting=false;
 }
}

/* ===== UI helpers ===== */
function toast(t){const e=$('.toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ===== Halaman penuh (pengganti pop up) =====
   sheet(html,{title,back}) tetap menjadi satu-satunya pintu masuk, jadi seluruh alur lama
   (daftar → detail → form → review → hasil) otomatis tampil sebagai halaman layar penuh.
   - back : fungsi tujuan tombol kembali (default: tutup halaman, kembali ke dashboard)
   - tombol Back Android / gestur kembali ikut menutup halaman, bukan keluar dari aplikasi */
const PG={open:false,entry:false,skip:false,back:null,title:'',dir:'fwd'};
const PG_ICO={
 back:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
 refresh:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/></svg>',
 plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
 chev:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
 qr:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>'
};
function pgPush(){ if(PG.entry||PG.skip)return; try{history.pushState({pg:1},'');PG.entry=true}catch(_){} }
function pgPop(){ if(!PG.entry)return; PG.entry=false; PG.skip=true; try{history.back()}catch(_){PG.skip=false} }
window.addEventListener('popstate',()=>{
 if(PG.skip){PG.skip=false; if(PG.open)pgPush(); return}   /* pop buatan kita sendiri */
 if(!PG.entry)return;
 PG.entry=false;                                            /* tombol Back perangkat ditekan */
 if(!PG.open)return;
 if(PG.back){pgPush();pageBack()}else pgHide();
});
function pgHide(){
 PG.open=false;PG.back=null;PG.title='';
 const el=$('.sheet'); if(el){el.classList.remove('on','swap-fwd','swap-back');el.setAttribute('aria-hidden','true')}
}
function closeSheet(){ if(!PG.open)return; pgHide(); pgPop(); }
function pageBack(){
 if(PG.back){const f=PG.back;PG.dir='back';try{f()}finally{PG.dir='fwd'}}
 else closeSheet();
}
const pgHead=(eyebrow,title,sub)=>`<div class="crud-sheet-head"><div>${eyebrow?`<span class="eyebrow">${eyebrow}</span>`:''}<h3>${title}</h3>${sub?`<small>${sub}</small>`:''}</div></div>`;
function pgInit(){
 const el=$('.sheet'); if(!el||el.__pg)return; el.__pg=1;
 el.addEventListener('scroll',()=>el.classList.toggle('scrolled',el.scrollTop>26),{passive:true});
}
const PG_ADD_LABEL={gerai:'Gerai',spg:'SPG',checker:'Checker',menu:'Menu',logistik:'Item',esKristal:'Kontak'};
function sheet(html,o){
 if(typeof o==='function')o={back:o};
 o=o||{};
 const el=$('.sheet'); if(!el)return;
 pgInit();
 /* judul: dari opsi, atau dari <h3> pertama (emoji di depan dibuang) */
 const m=/<h3[^>]*>([\s\S]*?)<\/h3>/.exec(html);
 const h3Text=m?m[1].replace(/<[^>]+>/g,'').replace(/^[^\p{L}\p{N}]+/u,'').trim():'';
 const title=o.title||h3Text||'Detail';
 const wasOpen=PG.open, same=wasOpen&&PG.title===title&&PG.dir!=='back'&&!o.animate;
 PG.back=o.back||null; PG.title=title;
 el.innerHTML=`<header class="pg-bar"><button type="button" class="pg-back" aria-label="Kembali" onclick="pageBack()">${PG_ICO.back}</button><div class="pg-title">${esc(title)}</div><div class="pg-slot"></div></header>`+html;
 el.setAttribute('aria-label',title); el.removeAttribute('aria-hidden');
 el.classList.toggle('has-h1',!!h3Text);
 /* emoji di judul besar dibuang agar tampil bersih & konsisten */
 el.querySelectorAll(':scope>h3,.crud-sheet-head h3,.crud-form-head h3').forEach(h=>{const t=h.firstChild; if(t&&t.nodeType===3)t.textContent=t.textContent.replace(/^[^\p{L}\p{N}]+/u,'')});
 el.querySelectorAll('.crud-sheet-head').forEach(h=>h.classList.add(h.querySelector('h3')?'pg-head':'pg-sec'));
 /* tombol muat-ulang pindah ke bar atas sebagai ikon */
 const rf=el.querySelector('.pg-head [id$="-refresh"]');
 if(rf){rf.className='pg-act';rf.setAttribute('aria-label','Muat ulang');rf.innerHTML=PG_ICO.refresh;el.querySelector('.pg-slot').appendChild(rf)}
 /* tombol Tambah pada daftar menjadi tombol melayang di bawah */
 const add=el.querySelector('.pg-head [data-crud-action="add"]');
 if(add){const k=add.dataset.k;add.className='pg-fab';add.innerHTML=PG_ICO.plus+'<span>Tambah '+(PG_ADD_LABEL[k]||'')+'</span>';const d=document.createElement('div');d.className='pg-dock fab';d.appendChild(add);el.appendChild(d)}
 /* dock aksi selalu menjadi anak langsung halaman agar menempel di bawah layar */
 el.querySelectorAll('.pg-dock').forEach(d=>{if(d.parentElement!==el)el.appendChild(d)});
 el.classList.toggle('has-dock',!!el.querySelector(':scope>.pg-dock'));
 el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>actX(b.dataset.x));
 svgify(el);
 /* tampilkan */
 el.classList.remove('swap-fwd','swap-back');
 if(!wasOpen){
   PG.open=true; el.scrollTop=0; el.classList.remove('scrolled');
   void el.offsetWidth; el.classList.add('on'); pgPush();
 }else if(!same){
   el.scrollTop=0; el.classList.remove('scrolled');
   void el.offsetWidth; el.classList.add(PG.dir==='back'?'swap-back':'swap-fwd');
 }
}
const li=(ic,t,s,r)=>`<div class="li"><div class="ic">${ic}</div><div class="b"><b>${t}</b><span>${s}</span></div>${r||''}</div>`;

/* ===== Login ===== */
function login(){
 const h=new Date().getHours(),g=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
 const ic=d=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
 const lock='M7 10V7.8a5 5 0 0 1 10 0V10M5 10h14v10H5z';
 const eye='M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z';
 const OWNER_EMAIL='denxudua@gmail.com';
 app.innerHTML=`<main class="lg" aria-label="Akses Owner">
   <section class="lg-hero">
    <div class="lg-brand">
      <div class="logo"><img src="${BRAND_LOGO}" alt="Teh Solo Mai-Cambreng"></div>
      <span class="lg-kicker"><i></i> Panel Owner</span>
      <h1>Selamat ${g}</h1>
      <p>Pusat kendali operasional <strong>Mai-Cambreng</strong>.</p>
    </div>
   </section>
   <section class="lg-card" aria-label="Masuk sebagai Owner">
    <div class="lg-heading"><strong>Masuk sebagai Owner</strong><span>Masukkan kode akses Owner untuk membuka dashboard.</span></div>
    <div class="lg-f" id="f">
      <span class="lead">${ic(lock)}</span>
      <label for="c">Kode akses</label>
      <input id="c" type="password" inputmode="numeric" placeholder="Masukkan kode akses" autocomplete="current-password" maxlength="64" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Kode akses Owner" aria-describedby="er">
      <button type="button" class="eye" id="eye" aria-label="Tampilkan kode akses" aria-pressed="false">${ic(eye)}</button>
    </div>
    <div class="lg-err" id="er" role="alert" aria-live="polite"></div>
    <button class="btn lg-btn" id="go" disabled>Masuk ke Dashboard</button>
    <div class="lg-security">${ic(lock)}<span>Akses aman · khusus Owner.</span></div>
    <p class="lg-note">Akun Owner aktif terhubung ke sistem.</p>
   </section>
 </main><div class="toast"></div>`;
 const c=$('#c'),b=$('#go'),f=$('#f'),er=$('#er'),card=$('.lg-card');
 const validate=()=>{b.disabled=!c.value.trim()};
 const fail=(msg)=>{er.textContent=msg;f.classList.add('bad');c.setAttribute('aria-invalid','true');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');if(navigator.vibrate)navigator.vibrate(120)};
 c.oninput=()=>{er.textContent='';f.classList.remove('bad');c.removeAttribute('aria-invalid');validate()};
 c.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
 b.onclick=go;
 $('#eye').onclick=()=>{const t=c.type==='password';c.type=t?'text':'password';$('#eye').innerHTML=ic(t?eye+'M4 4l16 16':eye);$('#eye').setAttribute('aria-pressed',t);$('#eye').setAttribute('aria-label',t?'Sembunyikan kode akses':'Tampilkan kode akses');c.focus()};
 async function go(){
   const code=c.value.trim(); if(!code||b.classList.contains('load'))return;
   b.classList.add('load');b.disabled=true;b.innerHTML='<i class="sp"></i> Memverifikasi…';c.blur();er.textContent='';
   try{
     await sbClient.auth.signOut({scope:'local'});
     const {data,error}=await sbClient.auth.signInWithPassword({email:OWNER_EMAIL,password:code});
     if(error) throw error;
     if(!data?.user||!data?.session) throw new Error('Masuk belum berhasil. Silakan coba lagi.');
     if(String(data.user.email||'').trim().toLowerCase()!==OWNER_EMAIL) throw new Error('Kode akses ini bukan milik akun Owner.');

     /* Auth sudah berhasil. Data dashboard dicoba dimuat, tetapi kegagalan data tidak membatalkan sesi Auth. */
     let dataWarning='';
     try{ await loadServerState(); }
     catch(loadErr){ console.error('OWNER_DATA_LOAD_AFTER_AUTH',loadErr); dataWarning=String(loadErr?.message||loadErr); }

     b.classList.replace('load','ok');b.disabled=false;b.innerHTML=ic('M5 12.5l4.5 4.5L19 7.5')+' Berhasil';
     if(navigator.vibrate)navigator.vibrate(30);
     setTimeout(()=>{shell();startRealtime();if(dataWarning)toast('Login berhasil. Sebagian data belum termuat.');},220);
   }catch(e){
     console.error('OWNER_LOGIN',e);b.classList.remove('load');b.innerHTML='Masuk ke Dashboard';validate();
     const raw=String(e?.message||e||'Kesalahan tidak diketahui');
     const low=raw.toLowerCase();
     if(low.includes('invalid login')||low.includes('invalid credentials')) fail('Kode akses tidak sesuai dengan akun Owner.');
     else fail(friendlyError(e,'Belum bisa masuk. Periksa internet Anda lalu coba lagi.'));
     c.focus();
   }
 }
}

function startJakartaClock(){
 const dateEl=$('#owner-date'),clockEl=$('#owner-clock');
 if(!dateEl&&!clockEl)return;
 const tick=()=>{
   const now=new Date();
   const dateText=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now);
   const timeText=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
   if(dateEl)dateEl.textContent=dateText;
   if(clockEl)clockEl.textContent=timeText;
 };
 clearInterval(window.__ownerClockTimer);
 tick();
 window.__ownerClockTimer=setInterval(tick,1000);
}
function highlightData(){
 const defaults=defaultHighlights();
 const moments=Array.isArray(ownerMoments)?ownerMoments.filter(Boolean):[];
 return [...defaults,...moments];
}
function renderHighlight(){
 const items=highlightData();
 if(!items.length)return '';
 const i=Math.max(0,Math.min(highlightIndex,items.length-1));
 const x=items[i]||items[0];
 const kind=String(x.kind||'default');
 const cls=kind==='default'
   ? (i===0?'highlight-sales':i===1?'highlight-bestseller':'highlight-revenue')
   : `highlight-${kind.replace(/[^a-z0-9_-]/gi,'')}`;
 const eyebrow=esc(x.eyebrow||'RINGKASAN OWNER');
 const title=esc(x.title||'Ringkasan');
 const value=esc(x.value??'—');
 const meta=esc(x.meta||'Tercatat hari ini');
 const icon=esc(x.icon||'📊');
 const link=LIVE_MONITORING_URL; // semua kartu membuka Live Monitoring saat di-tap
 return `<a class="highlight-card hl-lux ${cls} highlight-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer" aria-label="${title} - buka Live Monitoring">
   <div class="highlight-pattern"></div><div class="highlight-glow"></div>
   <div class="highlight-top"><span class="highlight-eyebrow">${eyebrow}</span><span class="highlight-index">${i+1}/${items.length}</span></div>
   <div class="highlight-body"><div class="highlight-icon">${icon}</div><div class="highlight-copy"><h2>${title}</h2><strong>${value}</strong><p>${meta}</p></div></div>
   <span class="highlight-go" aria-hidden="true">↗</span>
   <div class="highlight-progress"><i></i></div>
 </a>`;
}
function startHighlight(){
 const host=$('.highlight-host');
 if(!host)return;
 const items=highlightData();
 if(items.length<=1){highlightIndex=0;host.innerHTML=renderHighlight();return;}
 clearInterval(highlightTimer);
 highlightIndex=highlightIndex%items.length;
 host.innerHTML=renderHighlight();
 highlightTimer=setInterval(()=>{
   const h=$('.highlight-host');
   if(!h){clearInterval(highlightTimer);highlightTimer=null;return;}
   h.classList.add('swap');
   setTimeout(()=>{
     highlightIndex=(highlightIndex+1)%highlightData().length;
     h.innerHTML=renderHighlight();
     requestAnimationFrame(()=>h.classList.remove('swap'));
   },220);
 },5200);
}

async function showReport(key,start=todayJakarta(),end=todayJakarta()){
 if(key==='gerai'||key==='menu')return showPerformanceReport(key,start,end);
 window.__selectedReport=key;window.__reportRange={start,end};
 const d=REPORT_DEFS[key]||REPORT_DEFS.penjualan;
 sheet(`${pgHead('LAPORAN OWNER',d[0],d[2])}<section class="report-detail-page"><div class="report-filter-card"><div><b>Periode laporan</b><small>${esc(start)} s/d ${esc(end)}</small></div><button class="btn ghost" data-o="report-period">Ubah tanggal</button></div><div class="report-status-card"><span>Status data</span><b>Data terbaru</b><small>Laporan disusun dari transaksi yang tercatat.</small></div><div class="report-empty"><span>⏳</span><b>Memuat laporan...</b><small>Menyiapkan laporan...</small></div></section>`,{title:d[0]});
 bind();const host=$('.sheet');
 try{const data=await rpc('owner_get_report',{p_report_type:key,p_start_date:start,p_end_date:end,p_store_id:null});const box=host&&window.__selectedReport===key?host.querySelector('.report-empty'):null;if(box)box.outerHTML=renderReportData(data)}
 catch(e){const box=host&&window.__selectedReport===key?host.querySelector('.report-empty'):null;if(box)box.innerHTML=`<span>⚠️</span><b>Laporan tidak tersedia</b><small>${esc(friendlyError(e,'Laporan belum dapat ditampilkan. Coba lagi sebentar.'))}</small>`}
}
const PERF={key:null,start:null,end:null,seq:0};
function perfFmt(n){return(Number(n)||0).toLocaleString('id-ID')}
function perfDate(d,long=false){try{return new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:long?'long':'short',year:long?'numeric':undefined}).format(new Date(String(d)+'T12:00:00+07:00'))}catch(_){return String(d||'')}}
function perfRangeButtons(start,end){const n=Math.max(1,Math.round((new Date(end)-new Date(start))/86400000)+1);return[7,14,30,90].map(x=>`<button type="button" data-perf-range="${x}" class="${n===x?'on':''}">${x} hari</button>`).join('')}
function perfToolbar(key,start,end){return`<section class="perf-toolbar"><div class="perf-toolbar-top"><div class="perf-toolbar-title"><b>${key==='gerai'?'Performa Gerai':'Performa Menu'}</b><small>${key==='gerai'?'Bandingkan penjualan harian setiap gerai.':'Lihat pergerakan penjualan setiap menu.'}</small></div><button class="btn ghost" type="button" data-perf-refresh>↻</button></div><div class="perf-filter">${perfRangeButtons(start,end)}</div><div class="perf-custom"><label>Mulai<input id="perf-start" type="date" value="${esc(start)}" max="${esc(todayJakarta())}"></label><label>Sampai<input id="perf-end" type="date" value="${esc(end)}" max="${esc(todayJakarta())}"></label></div></section>`}
function perfBars(days,vals,label='Penjualan'){if(!days.length)return'';const max=Math.max(1,...vals.map(Number));return`<div class="perf-chart">${days.map((d,i)=>{const q=Number(vals[i])||0,h=q?Math.max(6,Math.round(q/max*100)):3;return`<div class="perf-bar ${q?'':'zero'}" title="${esc(perfDate(d,true))}: ${esc(perfFmt(q))}"><i style="height:${h}%"></i></div>`}).join('')}</div><div class="perf-axis"><span>${esc(perfDate(days[0]))}</span><span>${esc(perfDate(days[days.length-1]))}</span></div>`}
function perfCards(data,key){const daily=asArray(data?.daily),days=daily.map(x=>x.date),rows=key==='gerai'?asArray(data?.stores):asArray(data?.menus);if(!rows.length){const isGerai=key==='gerai';return`<div class="perf-empty"><div class="perf-empty-icon">${isGerai?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-6h6v6"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18H7z"/><path d="M9.5 7h5M9.5 11h5M9.5 15h3"/><path d="M5 5h2M17 5h2"/></svg>'}</div><span class="perf-empty-eyebrow">${isGerai?'PERFORMA GERAI':'PERFORMA MENU'}</span><strong>${isGerai?'Belum ada data performa gerai':'Belum ada data performa menu'}</strong><span>${isGerai?'Belum ada penjualan gerai yang selesai, dikunci, dan divalidasi Checker pada periode ini.':'Belum ada penjualan menu yang selesai, dikunci, dan divalidasi Checker pada periode ini.'}</span><div class="perf-empty-flow"><div class="perf-empty-step"><b>01</b>Penjualan</div><span class="perf-empty-arrow">›</span><div class="perf-empty-step"><b>02</b>Validasi Checker</div><span class="perf-empty-arrow">›</span><div class="perf-empty-step"><b>03</b>Masuk performa</div></div><span class="perf-empty-note">Data akan tampil otomatis setelah laporan harian difinalisasi.</span></div>`}return`<div class="perf-list">${rows.map(r=>{const map=new Map(asArray(r.daily).map(x=>[x.date,x])),vals=days.map(d=>Number(map.get(d)?.sales||0)),total=Number(r.total_sales||0),active=vals.filter(x=>x>0).length,avg=days.length?total/days.length:0,sub=key==='gerai'?`${perfFmt(r.total_transactions||0)} transaksi · ${active} hari berjualan`:`${perfFmt(r.total_quantity||0)} porsi terjual · ${active} hari terjual`;return`<article class="perf-card"><div class="perf-card-head"><div><b>${esc(r.store_name||r.menu_name||'Tanpa nama')}</b><small>${esc(sub)}</small></div><div class="perf-total"><b>${esc(rp(total))}</b><small>${key==='gerai'?'total penjualan':'total omzet'}</small></div></div>${perfBars(days,vals,'Penjualan')}<div class="perf-card-foot"><span>Rata-rata/hari <b>${esc(rp(Math.round(avg)))}</b></span><span>Hari terbaik <b>${esc(rp(Math.max(0,...vals)))}</b></span></div></article>`}).join('')}</div>`}
async function showPerformanceReport(key,start=todayJakarta(),end=todayJakarta()){
 if(start>end)[start,end]=[end,start];PERF.key=key;PERF.start=start;PERF.end=end;
 const title=key==='gerai'?'Performa Gerai':'Performa Menu';
 sheet(`${perfToolbar(key,start,end)}<div class="perf-page"><div id="perf-root"><div class="perf-loading"></div></div><p class="perf-note">Sumber data: snapshot penjualan harian final. Data hanya masuk setelah penutupan hari dikunci dan divalidasi Checker.</p></div>`,{title});
 const host=$('.sheet');if(!host)return;const root=host.querySelector('#perf-root');
 const load=async()=>{const seq=++PERF.seq,a=host.querySelector('#perf-start')?.value||PERF.start,b=host.querySelector('#perf-end')?.value||PERF.end;if(!a||!b)return;if(a>b){toast('Tanggal mulai tidak boleh melewati tanggal akhir');return}PERF.start=a;PERF.end=b;if(root)root.innerHTML='<div class="perf-loading"></div>';try{const businessId=state.header?.business_id||'e8f4c3bd-9769-4722-97a5-50908bc1acba';const data=await rpc('owner_get_performance_report',{p_business_id:businessId,p_start_date:a,p_end_date:b});if(seq!==PERF.seq)return;const rows=key==='gerai'?asArray(data?.stores):asArray(data?.menus),period=data?.period||{},days=asArray(data?.daily),total=key==='gerai'?Number(period.total_sales||0):rows.reduce((s,r)=>s+Number(r.total_sales||0),0);root.innerHTML=`<div class="perf-status"><i></i><span>${esc(perfDate(a,true))} — ${esc(perfDate(b,true))} · ${days.length} hari data final</span></div><div class="perf-summary"><div class="perf-summary-card"><span>${key==='gerai'?'Total penjualan':'Total omzet'}</span><b>${esc(rp(total))}</b><small>periode final</small></div><div class="perf-summary-card"><span>${key==='gerai'?'Gerai':'Menu'}</span><b>${perfFmt(rows.length)}</b><small>memiliki data final</small></div><div class="perf-summary-card"><span>Hari final</span><b>${perfFmt(days.length)}</b><small>tervalidasi Checker</small></div></div>${perfCards(data,key)}`}catch(e){if(root)root.innerHTML=`<div class="perf-empty"><strong>Data performa belum dapat dimuat</strong><span>${esc(friendlyError(e,'Periksa koneksi lalu coba lagi.'))}</span></div>`}};
 host.querySelectorAll('[data-perf-range]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.perfRange)||7,ed=todayJakarta(),d=new Date(ed+'T12:00:00+07:00');d.setDate(d.getDate()-n+1);const st=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(d);showPerformanceReport(key,st,ed)});
 host.querySelector('[data-perf-refresh]')?.addEventListener('click',load);
 ['perf-start','perf-end'].forEach(id=>host.querySelector('#'+id)?.addEventListener('change',()=>{const a=host.querySelector('#perf-start').value,b=host.querySelector('#perf-end').value;if(a&&b)showPerformanceReport(key,a,b)}));
 await load();
}

   Sumber: snapshot final hari itu (dibuat saat SEMUA gerai tutup + penutupan hari oleh Checker).
   "Total penjualan" = jumlah porsi terjual, bukan nominal rupiah.

const SR={date:null,pinned:false,latest:null,dates:[],seq:0};
const srNum=n=>(Number(n)||0).toLocaleString('id-ID');
function srDate(d,mode){
 if(!d)return '—';
 try{
  const str=String(d);
  const dt=str.length>10?new Date(str):new Date(str+'T12:00:00+07:00');
  const o=mode==='short'?{day:'numeric',month:'short'}:mode==='long'?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'};
  return new Intl.DateTimeFormat('id-ID',Object.assign({timeZone:'Asia/Jakarta'},o)).format(dt);
 }catch(_){return String(d)}
}
function srNav(cur,d){
 const isLatest=!!SR.latest&&cur===SR.latest;
 const step=(dt,prev)=>`<button type="button" class="sr-step" data-sr-go="${esc(dt||'')}" aria-label="${prev?'Laporan sebelumnya':'Laporan berikutnya'}"${dt?'':' disabled'}>${prev?PG_ICO.back:PG_ICO.chev}</button>`;
 return `<div class="sr-nav">${step(d&&d.prev_date,true)}<label class="sr-pick"><span class="sr-pick-top">${isLatest?'Laporan terakhir':'Tanggal laporan'}</span><b>${esc(srDate(cur,'long'))}</b><small>Ketuk untuk memilih tanggal</small><input type="date" id="sr-date" value="${esc(cur)}" max="${esc(todayJakarta())}" aria-label="Pilih tanggal laporan"></label>${step(d&&d.next_date,false)}</div>`;
}
function srChips(cur){
 const ds=SR.dates.slice(0,14);

function srHero(d){
 const s=d.summary||{};
 const fin=d.finalized_at?`Dikunci ${srDate(d.finalized_at)} · ${fmtJamWib(d.finalized_at)}`:'Laporan final';
 return `<section class="sr-hero"><span class="sr-eyebrow">TOTAL PENJUALAN HARIAN</span><div class="sr-big"><b>${srNum(s.items_sold)}</b><span>porsi terjual</span></div><div class="sr-kpis"><div><b>${srNum(s.transaction_count)}</b><small>Transaksi</small></div><div><b>${srNum(s.closed_store_count)}/${srNum(s.store_count)}</b><small>Gerai tutup</small></div><div><b>${srNum(s.menu_count)}</b><small>Menu terjual</small></div></div><div class="sr-final"><i></i>${esc(fin)}</div></section>`;

function srStores(d){
 const rows=asArray(d.stores);
 const head=`<div class="sr-sec-head"><h4>Penjualan per gerai</h4><span>${rows.length} gerai</span></div>`;
 if(!rows.length)return `<section class="sr-sec">${head}<div class="sr-card"><div class="sr-none">Tidak ada data gerai pada laporan ini.</div></div></section>`;
 const max=Math.max(1,...rows.map(r=>Number(r.items_sold)||0));
 return `<section class="sr-sec">${head}<div class="sr-card">${rows.map(r=>{
  const q=Number(r.items_sold)||0,w=q?Math.max(4,Math.round(q/max*100)):0;

 }).join('')}</div></section>`;

function srMenus(d){
 const rows=asArray(d.menus);
 const head=`<div class="sr-sec-head"><h4>Menu terjual</h4><span>${rows.length} menu</span></div>`;
 if(!rows.length)return `<section class="sr-sec">${head}<div class="sr-card"><div class="sr-none">Tidak ada menu terjual pada hari ini.</div></div></section>`;
 const tot=rows.reduce((a,r)=>a+(Number(r.quantity)||0),0)||1;

 }).join('')}</div></section>`;

function srRender(d){

 }
 root.querySelectorAll('[data-sr-go]').forEach(b=>b.onclick=()=>{const v=b.dataset.srGo;if(v)srGo(v)});
 const inp=root.querySelector('#sr-date');
 if(inp){

 }
 const on=root.querySelector('.sr-chip.on'),strip=root.querySelector('.sr-chips');
 if(on&&strip)strip.scrollLeft=Math.max(0,on.offsetLeft-strip.clientWidth/2+on.offsetWidth/2);

async function srLoad(silent){

 try{

   rpc('owner_get_sales_report',{p_sales_date:SR.pinned?SR.date:null}),
   safeLoad(rpc('owner_list_sales_report_dates',{p_limit:60}),null)
  ]);
  if(my!==SR.seq||!document.querySelector('#sr-root'))return;
  const prevLatest=SR.latest;
  SR.dates=asArray(list&&list.dates);
  SR.latest=(d&&d.latest_date)||(list&&list.latest)||null;
  state.salesLatest=SR.latest;
  if(!SR.pinned&&d&&d.sales_date)SR.date=d.sales_date;
  srRender(d||{status:'NONE_AVAILABLE'});
  if(silent&&!SR.pinned&&prevLatest&&SR.latest&&SR.latest!==prevLatest)toast('Laporan terbaru sudah masuk');
 }catch(e){
  console.error(e);
  if(my!==SR.seq)return;
  if(silent)return;
  const root=document.querySelector('#sr-root');
  if(root){
   root.innerHTML=`<div class="sr-empty"><div class="sr-empty-ic err">!</div><b>Laporan belum dapat dimuat</b><p>${esc(friendlyError(e,'Periksa koneksi internet lalu coba lagi.'))}</p><div class="sr-links"><button type="button" class="sr-link" data-sr-retry><span>Coba lagi</span><b>Muat ulang</b></button></div></div>`;
   const r=root.querySelector('[data-sr-retry]');if(r)r.onclick=()=>{root.innerHTML=srSkeleton();srLoad(false)};
  }
 }
}

    return `<div class="tg-row">${main}<div class="tg-side">${nom}<span class="chip warn">Belum dibayar</span></div></div>`;
  };
  const rowPaid=b=>{
    const inv=invOf.get(b.id);
    const meta=[b.quantity?tgQty(b.quantity):'',fmtWaktu(b.paid_at||b.created_at)].filter(Boolean).join(' · ');
    const nom=Number(b.amount)>0?`<span class="amt">${rp(b.amount)}</span>`:'';
    const chip=inv?`<span class="chip ok">Lunas · ${esc(inv.invoice_number)}</span>`:`<span class="chip ok">${b.payment_option==='pay_now'?'Bayar langsung':'Lunas'}</span>`;
    return `<div class="tg-row${inv?' tg-link':''}"${inv?` data-tginv="${esc(inv.id)}"`:''}><div class="tg-main"><b>${esc(b.depo_name||b.description||'Tagihan')}</b><span>${esc(meta)}</span></div><div class="tg-side">${nom}${chip}</div></div>`;
  };
  const byStore=(rows,fn,pick)=>{
    const m=new Map();
    rows.forEach(b=>{const k=b.store_id||'-';if(!m.has(k))m.set(k,[]);m.get(k).push(b)});
    return [...m.entries()].map(([id,list])=>{
      const qty=tgSumQty(list);
      const all=pick&&list.every(b=>TG.sel.has(b.id));
      const btn=pick?`<button type="button" class="tg-mini" data-tgstore="${esc(id)}">${all?'Batal pilih':'Pilih semua'}</button>`:'';
      return `<div class="tg-store"><div class="tg-store-h"><b>🏪 ${esc(tgStoreName(id))}</b><span>${list.length} drop${qty?' · '+tgQty(qty):''}${btn}</span></div>${list.map(fn).join('')}</div>`;
    }).join('');
  };
  const tile=(cls,title,rows)=>`<div class="tg-tile ${cls}"><small>${title}</small><b>${rows.length}</b><em>${tgQty(tgSumQty(rows))}</em></div>`;
  const actBtn=!unpaid.length?`<span class="chip warn">0 drop</span>`:(TG.select?'<button type="button" class="tg-btn ghost" data-tgcancel>Batal</button>':'<button type="button" class="tg-btn" data-tgstart>Bayar Tagihan</button>');
  const selAll=TG.select?`<label class="tg-selall"><input type="checkbox" class="tg-chk" data-tgall> Pilih semua (${unpaid.length})</label>`:'';
  const unpaidSec=`<section class="tg-sec warn"><div class="tg-sec-h"><span class="tg-ic">🧾</span><div class="t"><b>Belum Dibayar</b><small>${TG.select?'Pilih tagihan yang akan dibayar':'Menunggu pembayaran'}</small></div>${actBtn}</div>${selAll}${unpaid.length?byStore(unpaid,rowUnpaid,TG.select):'<div class="tg-empty">Tidak ada tagihan yang belum dibayar.</div>'}</section>`;
  const paidSec=`<section class="tg-sec ok"><div class="tg-sec-h"><span class="tg-ic">💵</span><div class="t"><b>Sudah Dibayar</b><small>Lunas dan tercatat</small></div><span class="chip ok">${paid.length} drop</span></div>${paid.length?byStore(paid,rowPaid,false):'<div class="tg-empty">Belum ada tagihan yang dibayar.</div>'}</section>`;
  const invSec=invoices.length?`<section class="tg-sec ok"><div class="tg-sec-h"><span class="tg-ic">📄</span><div class="t"><b>Invoice Terbit</b><small>Ketuk untuk membuka, menyimpan, atau mengirim</small></div><span class="chip ok">${invoices.length}</span></div><div class="tg-store">${invoices.slice(0,30).map(i=>`<div class="tg-row tg-link" data-tginv="${esc(i.id)}"><div class="tg-main"><b>${esc(i.invoice_number)}</b><span>${esc([fmtWaktu(i.issued_at),i.depo_name,i.bill_count+' tagihan'].filter(Boolean).join(' · '))}</span></div><div class="tg-side"><span class="amt">${rp(i.total_amount)}</span></div></div>`).join('')}</div></section>`:'';
  const dock=TG.select?`<div class="pg-dock" id="tgdock"><div class="tg-dock-in"><div class="tg-dock-t"><b id="tgbarN">0 tagihan dipilih</b><small id="tgbarQ">Centang tagihan yang akan dibayar</small></div><button type="button" class="btn" id="tgmake" disabled>Buat Invoice</button></div></div>`:'';
  sheet(`${pgHead('KEUANGAN','Tagihan',bills.length+' drop tercatat')}<div class="tg-sum">${tile('warn','Belum dibayar',unpaid)}${tile('ok','Sudah dibayar',paid)}</div>${unpaidSec}${paidSec}${invSec}${dock}`);
  const el=$('.sheet');if(!el)return;
  const syncChecks=()=>el.querySelectorAll('[data-tgpick]').forEach(c=>{c.checked=TG.sel.has(c.dataset.tgpick)});
  el.querySelector('[data-tgstart]')?.addEventListener('click',()=>{TG.select=true;TG.sel=new Set();tagihanSheet()});
  el.querySelector('[data-tgcancel]')?.addEventListener('click',()=>{TG.select=false;TG.sel=new Set();tagihanSheet()});
  el.querySelectorAll('[data-tgpick]').forEach(c=>c.addEventListener('change',()=>{c.checked?TG.sel.add(c.dataset.tgpick):TG.sel.delete(c.dataset.tgpick);tgSyncBar(unpaid)}));
  el.querySelector('[data-tgall]')?.addEventListener('change',e=>{unpaid.forEach(b=>e.target.checked?TG.sel.add(b.id):TG.sel.delete(b.id));syncChecks();tgSyncBar(unpaid)});
  el.querySelectorAll('[data-tgstore]').forEach(bt=>bt.addEventListener('click',()=>{
    const sid=bt.dataset.tgstore,list=unpaid.filter(b=>(b.store_id||'-')===sid),all=list.every(b=>TG.sel.has(b.id));
    list.forEach(b=>all?TG.sel.delete(b.id):TG.sel.add(b.id));
    syncChecks();bt.textContent=all?'Pilih semua':'Batal pilih';tgSyncBar(unpaid);
  }));
  el.querySelector('#tgmake')?.addEventListener('click',()=>{if(TG.sel.size)tgInvoiceForm()});
  el.querySelectorAll('[data-tginv]').forEach(n=>n.addEventListener('click',()=>invoiceView(n.dataset.tginv)));
  tgSyncBar(unpaid);
}

/* ----- Langkah 2: susun invoice dari tagihan terpilih (total dihitung otomatis) ----- */
function tgInvoiceForm(){
  const picked=(state.bills||[]).filter(b=>TG.sel.has(b.id)&&b.status==='open').sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  if(!picked.length){TG.select=false;tagihanSheet();return}
  const contacts=(ownerCrud.esKristal||[]).filter(c=>c.status==='Aktif');
  const firstDepo=String(picked[0].depo_name||'').trim().toLowerCase();
  const pre=contacts.find(c=>firstDepo&&String(c.nama||'').trim().toLowerCase()===firstDepo)||contacts[0];
  const needPrice=picked.some(b=>!(Number(b.amount)>0));
  const lastPrice=Number((state.invoices||[]).find(i=>Number(i.unit_price)>0)?.unit_price)||'';
  const lines=picked.map(b=>`<div class="inv-line"><div><b>${esc(tgStoreName(b.store_id))}</b><span>${esc([b.depo_name,fmtTglPendek(b.created_at),b.quantity?tgQty(b.quantity):''].filter(Boolean).join(' · '))}</span></div><em data-ln="${esc(b.id)}">—</em></div>`).join('');
  const contactField=contacts.length
    ?`<label class="crud-field"><span>Kirim ke depo es (WhatsApp)</span><select class="fld" id="invc">${contacts.map(c=>`<option value="${esc(c.id)}"${pre&&pre.id===c.id?' selected':''}>${esc(c.nama)}${c.telepon?' · '+esc(c.telepon):''}</option>`).join('')}</select></label>`
    :`<div class="crud-form-section"><b>Depo es belum terdaftar</b><small>Tambahkan kontak di Kelola Usaha › Kontak WhatsApp Es Kristal agar invoice bisa dikirim. Invoice tetap bisa diterbitkan sekarang.</small></div>`;
  sheet(`${pgHead('KEUANGAN','Buat Invoice',picked.length+' tagihan dipilih · '+tgQty(tgSumQty(picked)))}<section class="tg-sec inv-lines">${lines}</section><div class="crud-form">${contactField}${needPrice?crudField('Harga per BAL (Rp)','invp','text','Contoh: 25000',lastPrice):''}${crudField('Catatan (opsional)','invn','text','Misal: pembayaran transfer','')}</div><div class="inv-total"><small>TOTAL INVOICE</small><b id="invtot">Rp0</b></div><div class="hint">Setelah invoice diterbitkan, semua tagihan di atas langsung dicatat <b>sudah dibayar</b> dan invoice tidak dapat diubah.</div><div class="pg-dock"><button type="button" class="btn" id="invgo" disabled>Terbitkan Invoice</button></div>`,{back:()=>tagihanSheet()});
  const el=$('.sheet');if(!el)return;
  const pIn=el.querySelector('#cf-invp'),nIn=el.querySelector('#cf-invn'),cSel=el.querySelector('#invc'),go=el.querySelector('#invgo');
  if(pIn)pIn.setAttribute('inputmode','numeric');
  const price=()=>pIn?(Number(String(pIn.value).replace(/\D/g,''))||0):0;
  const amt=b=>Number(b.amount)>0?tgRound(b.amount):tgRound((Number(b.quantity)||0)*price());
  const calc=()=>{
    let total=0,ok=true;
    picked.forEach(b=>{const a=amt(b);if(!(a>0))ok=false;total+=a;const n=el.querySelector(`[data-ln="${b.id}"]`);if(n)n.textContent=a>0?rp(a):'—'});
    el.querySelector('#invtot').textContent=ok?rp(tgRound(total)):'Rp0';
    go.disabled=!ok||TG.busy;
    return ok?tgRound(total):0;
  };
  pIn?.addEventListener('input',calc);
  calc();
  go.onclick=async()=>{
    if(TG.busy)return;
    if(!(calc()>0)){toast('Isi harga per BAL terlebih dahulu.');return}
    TG.busy=true;go.disabled=true;go.textContent='Menerbitkan…';
    try{
      const res=await rpc('owner_create_invoice',{p_bill_ids:picked.map(b=>b.id),p_unit_price:needPrice?price():null,p_contact_id:cSel&&cSel.value?cSel.value:null,p_notes:nIn&&nIn.value.trim()?nIn.value.trim():null});
      TG.select=false;TG.sel=new Set();
      await tgReload();
      toast('Invoice '+res.invoice_number+' terbit. Tagihan dicatat lunas.');
      invoiceView(res.invoice_id);
    }catch(e){
      console.error('OWNER_INVOICE',e);
      const gone=/invoice_bill_not_available/.test(String(e?.message||e));
      toast(friendlyError(e,'Invoice belum bisa dibuat. Pastikan migrasi database invoice sudah diterapkan, lalu coba lagi.'));
      if(gone){TG.sel=new Set();await tgReload();tagihanSheet()}
      else{go.textContent='Terbitkan Invoice';calc()}
    }finally{TG.busy=false}
  };
}

/* ----- Langkah 3: tampilan invoice resmi + simpan + kirim WhatsApp ----- */
function waNumber(v){
  let n=String(v||'').replace(/\D/g,'');
  if(!n)return '';
  if(n.startsWith('00'))n=n.slice(2);
  if(n.startsWith('0'))n='62'+n.slice(1);
  else if(n.startsWith('8'))n='62'+n;
  return n;
}
function invoiceItemsOf(id){
  return (state.invoiceItems||[]).filter(x=>x.invoice_id===id).sort((a,b)=>new Date(a.bill_date||0)-new Date(b.bill_date||0));
}
function invoiceCardHtml(inv,items){
  const rows=items.map(it=>`<div class="inv-tr"><div><b>${esc(it.store_name||'Gerai')}</b><span>${esc([fmtTglPendek(it.bill_date),it.quantity?tgQty(it.quantity):'',Number(it.unit_price)>0?'× '+rp(it.unit_price):''].filter(Boolean).join(' · '))}</span></div><em>${rp(it.amount)}</em></div>`).join('');
  return `<article class="inv-card"><header class="inv-top"><img class="inv-logo" src="./gerai/icon-192.png" alt="Logo Teh Solo Ma'Gambreng"><div><b>Teh Solo Ma'Gambreng</b><small>Rangkuman Tagihan Es Kristal</small></div><span class="inv-tag">RINGKASAN</span></header><div class="inv-meta"><div><small>No. Invoice</small><b>${esc(inv.invoice_number)}</b></div><div><small>Tanggal</small><b>${esc(fmtTglPanjang(inv.issued_at))}</b><span>${esc(fmtJamWib(inv.issued_at))}</span></div><div class="wide"><small>Kepada</small><b>${esc(inv.depo_name||'—')}</b>${inv.depo_phone?`<span>${esc(inv.depo_phone)}</span>`:''}</div></div><div class="inv-th"><span>RINCIAN TAGIHAN</span><span>SUBTOTAL</span></div>${rows}<div class="inv-sum"><div><small>TOTAL TAGIHAN</small><em>${items.length} tagihan terpilih</em></div><b>${rp(inv.total_amount)}</b></div><div class="inv-foot"><p>${inv.notes?'Catatan: '+esc(inv.notes):'Rangkuman dari tagihan yang dipilih.'}</p></div></article>`;
}
function invoiceWaText(inv,items){
  const m=new Map();
  items.forEach(it=>{const k=it.store_name||'Gerai';const v=m.get(k)||{q:0,a:0};v.q+=Number(it.quantity)||0;v.a+=Number(it.amount)||0;m.set(k,v)});
  const rows=[...m.entries()].map(([k,v],i)=>`${i+1}. ${k} - ${v.q?tgQty(v.q):'-'} = ${rp(v.a)}`);
  return [
    'RINGKASAN PEMAKAIAN ES KRISTAL',
    'TGL : '+fmtTglPanjang(inv.issued_at),
    '',
    ...rows,
    '',
    'TOTAL JUMLAH TAGIHAN = '+rp(inv.total_amount),
    '',
    '- tagihan ini otomatis berdasarkan perhitungan sistem penerimaan es kristal panel app Ma Gambreng'
  ].join('\n');
}
function invLoadLogo(){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='./gerai/icon-192.png'})}
async function invoicePng(inv,items){
  const logo=await invLoadLogo();
  const S=2,W=860,P=48,FONT='-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const rowsH=Math.max(items.length,1)*66;
  const tableTop=392,rowsTop=tableTop+44,totalTop=rowsTop+rowsH+24,totalH=96;
  const H=totalTop+totalH+(inv.notes?64:24)+64;
  const cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;
  const x=cv.getContext('2d');x.scale(S,S);
  const rr=(px,py,w,h,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()};
  const t=(s,px,py,o={})=>{
    const {size=22,weight=400,color='#17241F',align='left',maxW=0}=o;
    x.font=`${weight} ${size}px ${FONT}`;x.fillStyle=color;x.textAlign=align;x.textBaseline='alphabetic';
    let v=String(s??'');
    if(maxW&&x.measureText(v).width>maxW){while(v.length>1&&x.measureText(v+'…').width>maxW)v=v.slice(0,-1);v+='…'}
    x.fillText(v,px,py);
  };
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  x.fillStyle='#0F3D35';x.fillRect(0,0,W,150);
  x.fillStyle='#FFFFFF';x.beginPath();x.arc(P+48,75,48,0,Math.PI*2);x.fill();
  if(logo){x.save();x.beginPath();x.arc(P+48,75,46,0,Math.PI*2);x.clip();x.drawImage(logo,P+2,29,92,92);x.restore()}
  t("Teh Solo Ma'Gambreng",P+120,72,{size:32,weight:800,color:'#FFFFFF'});
  t('Rangkuman Tagihan Es Kristal',P+120,106,{size:18,color:'#CFEFE3'});
  t('RINGKASAN',W-P,86,{size:30,weight:800,color:'#CFEFE3',align:'right'});
  const c2=W/2+10,lab={size:14,weight:700,color:'#718079'};
  t('NO. INVOICE',P,196,lab);t(inv.invoice_number,P,228,{size:26,weight:800});
  t('TANGGAL',c2,196,lab);t(fmtTglPanjang(inv.issued_at),c2,228,{size:26,weight:800});
  t(fmtJamWib(inv.issued_at),c2,254,{size:17,color:'#718079'});
  t('KEPADA',P,300,lab);t(inv.depo_name||'—',P,332,{size:26,weight:800,maxW:W-2*P});
  if(inv.depo_phone)t(inv.depo_phone,P,358,{size:17,color:'#718079'});
  x.fillStyle='#F2F6F4';x.fillRect(0,tableTop,W,44);
  t('RINCIAN TAGIHAN',P,tableTop+28,{size:14,weight:800,color:'#587267'});
  t('SUBTOTAL',W-P,tableTop+28,{size:14,weight:800,color:'#587267',align:'right'});
  items.forEach((it,i)=>{
    const y=rowsTop+i*66;
    t(it.store_name||'Gerai',P,y+28,{size:22,weight:700,maxW:W-2*P-220});
    const sub=[fmtTglPendek(it.bill_date),it.quantity?tgQty(it.quantity):'',Number(it.unit_price)>0?'× '+rp(it.unit_price):''].filter(Boolean).join(' · ');
    t(sub,P,y+52,{size:16,color:'#718079',maxW:W-2*P-220});
    t(rp(it.amount),W-P,y+38,{size:22,weight:800,align:'right'});
    x.fillStyle='#E4EBE8';x.fillRect(P,y+65,W-2*P,1);
  });
  x.fillStyle='#E7F7F0';rr(P,totalTop,W-2*P,totalH,18);x.fill();
  t('TOTAL TAGIHAN',P+24,totalTop+40,{size:15,weight:800,color:'#118A6A'});
  t(items.length+' tagihan terpilih',P+24,totalTop+68,{size:16,color:'#587267'});
  t(rp(inv.total_amount),W-P-24,totalTop+72,{size:42,weight:800,color:'#0F3D35',align:'right'});
  if(inv.notes)t('Catatan: '+inv.notes,P,totalTop+totalH+48,{size:17,color:'#4A5A54',maxW:W-2*P});
  t('Rangkuman tagihan diterbitkan melalui sistem Owner Ma-Gambreng.',W/2,H-30,{size:14,color:'#718079',align:'center',maxW:W-2*P});
  return cv;
}
async function invoiceFile(inv,items){
  const cv=await invoicePng(inv,items);
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(!blob)throw new Error('Gambar invoice gagal dibuat');
  return new File([blob],inv.invoice_number+'.png',{type:'image/png'});
}
function downloadFile(f){
  const u=URL.createObjectURL(f),a=document.createElement('a');
  a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function invoiceView(id){
  const inv=(state.invoices||[]).find(i=>i.id===id);
  if(!inv){tagihanSheet();return}
  const items=invoiceItemsOf(id);
  const canShare=!!navigator.share;
  sheet(`${pgHead('INVOICE',esc(inv.invoice_number),'Rangkuman tagihan terpilih')}${invoiceCardHtml(inv,items)}<div class="inv-actions"><button type="button" class="btn" id="invwa">Kirim ke WhatsApp Depo</button><button type="button" class="btn ghost" id="invsave">Simpan Gambar Invoice</button>${canShare?'<button type="button" class="btn ghost" id="invshare">Bagikan Gambar…</button>':''}<button type="button" class="btn ghost" id="invback">Kembali ke Tagihan</button></div>`,{back:()=>tagihanSheet()});
  const el=$('.sheet');if(!el)return;
  el.querySelector('#invwa').onclick=()=>{
    const contact=(ownerCrud.esKristal||[]).find(c=>c.id===inv.contact_id);
    const n=waNumber(inv.depo_phone||(contact&&contact.telepon)||'');
    if(!n)toast('Nomor WhatsApp depo belum ada. Pilih kontak langsung di WhatsApp.');
    window.open('https://wa.me/'+n+'?text='+encodeURIComponent(invoiceWaText(inv,items)),'_blank','noopener');
  };
  el.querySelector('#invsave').onclick=async()=>{
    try{downloadFile(await invoiceFile(inv,items));toast('Gambar invoice disimpan.')}
    catch(e){console.error(e);toast('Gambar invoice belum bisa dibuat. Coba lagi.')}
  };
  const sh=el.querySelector('#invshare');
  if(sh)sh.onclick=async()=>{
    try{
      const f=await invoiceFile(inv,items);
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Invoice '+inv.invoice_number});return}
      downloadFile(f);toast('Gambar invoice disimpan.');
    }catch(e){if(e&&e.name==='AbortError')return;console.error(e);toast('Gambar invoice belum bisa dibagikan.')}
  };
  el.querySelector('#invback').onclick=()=>tagihanSheet();
}

function annLeft(a){const ms=new Date(a.expires_at)-Date.now();if(ms<=0)return 'berakhir';const m=Math.floor(ms/60000),h=Math.floor(m/60);return 'sisa '+(h?h+' j ':'')+(m%60)+' mnt'}
function annErr(e){const m=String(e?.message||e||'');
 if(/announcement_too_long/.test(m))return 'Pengumuman maksimal '+ANN_MAX+' karakter.';

 return friendlyError(e,'Pengumuman belum berhasil diproses. Coba lagi.')}
