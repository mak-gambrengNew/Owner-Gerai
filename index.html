}
function annForm(aud,text){
 return `<div class="ann-note"><span>ℹ️</span><span>Pengumuman baru <b>ditambahkan</b> di belakang yang masih aktif, tidak menggantikan. Tayang 24 jam sejak dikirim.</span></div>
 <label class="crud-field"><span>Isi pengumuman</span><textarea class="fld" id="ann-text" rows="5" maxlength="${ANN_MAX}" placeholder="Tulis singkat dan jelas. Contoh: Stok gelas dikirim besok pagi.">${esc(text||'')}</textarea></label>
 <div class="ann-count" id="ann-count">0/${ANN_MAX}</div>
 <div class="ann-prev" id="ann-prev" aria-label="Pratinjau"></div>`;
}
function annWire(){
 const t=$('#ann-text'),c=$('#ann-count'),pv=$('#ann-prev');if(!t)return;
 const upd=()=>{const n=t.value.length;c.textContent=n+'/'+ANN_MAX;c.classList.toggle('warn',n>=ANN_MAX-20);pv.textContent=t.value.trim()||'Pratinjau teks berjalan…';pv.style.opacity=t.value.trim()?1:.5};
 t.addEventListener('input',upd);upd();
}
function annCompose(aud){
 sheet(`${pgHead('PENGUMUMAN',ANN_AUD[aud].t,ANN_AUD[aud].d)}${annForm(aud,'')}<div class="pg-dock"><button class="btn" id="ann-send">Tayangkan pengumuman</button></div>`,annMenu);
 annWire();
 $('#ann-send').onclick=async ev=>{
  const b=ev.currentTarget,msg=$('#ann-text').value.trim();
  if(!msg)return toast('Isi pengumuman wajib diisi');
  b.disabled=true;b.textContent='Mengirim…';
  try{await rpc('owner_create_announcement',{p_audience:aud,p_message:msg});toast('Pengumuman tayang selama 24 jam');annActive()}
  catch(e){console.error(e);b.disabled=false;b.textContent='Tayangkan pengumuman';toast(annErr(e))}
 };
}
async function annActive(){
 let rows;
 try{rows=await annFetch()}catch(e){console.error(e);return toast(annErr(e))}
 sheet(`${pgHead('PENGUMUMAN','Pengumuman Aktif',rows.length?rows.length+' sedang tayang':'Tidak ada yang tayang')}${rows.length?rows.map(a=>`<div class="ann-row" data-id="${esc(a.id)}"><div class="ann-meta"><span class="chip ${a.audience==='semua'?'ok':''}">${ANN_AUD[a.audience].t}</span><span>${esc(fmtWaktu(a.created_at))}</span><span>· ${annLeft(a)}</span></div><p>${esc(a.message)}</p><div class="ann-act"><button data-e="${esc(a.id)}">Edit</button><button class="del" data-d="${esc(a.id)}">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada pengumuman aktif.<br>Pengumuman hilang otomatis 24 jam setelah dikirim.</div>'}`,annMenu);
 document.querySelectorAll('.sheet [data-e]').forEach(b=>b.onclick=()=>annEdit(rows.find(x=>x.id===b.dataset.e)));
 document.querySelectorAll('.sheet [data-d]').forEach(b=>{let t;b.onclick=async()=>{
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Yakin hapus?';t=setTimeout(()=>{b.classList.remove('sure');b.textContent='Hapus'},3500);return}
  clearTimeout(t);b.disabled=true;
  try{await rpc('owner_remove_announcement',{p_id:b.dataset.d});toast('Pengumuman dihapus');annActive()}
  catch(e){console.error(e);b.disabled=false;toast(annErr(e));annActive()}
 }});
}
function annEdit(a){
 if(!a)return annActive();
 let aud=a.audience;
 sheet(`${pgHead('PENGUMUMAN','Edit Pengumuman','Masa tayang tidak diperpanjang.')}<div class="ann-seg">${['gerai','checker','semua'].map(k=>`<button data-a="${k}" class="${k===aud?'on':''}">${ANN_AUD[k].t.replace('Untuk ','')}</button>`).join('')}</div>${annForm(aud,a.message)}<div class="pg-dock"><button class="btn" id="ann-save">Simpan perubahan</button></div>`,annActive);
 annWire();
 document.querySelectorAll('.sheet [data-a]').forEach(b=>b.onclick=()=>{aud=b.dataset.a;document.querySelectorAll('.sheet [data-a]').forEach(x=>x.classList.toggle('on',x===b))});
 $('#ann-save').onclick=async ev=>{
  const b=ev.currentTarget,msg=$('#ann-text').value.trim();
  if(!msg)return toast('Isi pengumuman wajib diisi');
  b.disabled=true;b.textContent='Menyimpan…';
  try{await rpc('owner_update_announcement',{p_id:a.id,p_audience:aud,p_message:msg});toast('Pengumuman diperbarui');annActive()}
  catch(e){console.error(e);b.disabled=false;b.textContent='Simpan perubahan';toast(annErr(e))}
 };
}

const NT_CSS=`.nt{width:148mm;height:210mm;background:#FBF9F4;color:#14302A;position:relative;overflow:hidden;font:9pt/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:12mm 12mm 0;box-sizing:border-box}
.nt:before{content:"";position:absolute;left:5mm;right:5mm;top:5mm;bottom:5mm;border:.25mm solid #B8923A}
.nt-hd{text-align:center;padding-bottom:5mm;border-bottom:.3mm solid #B8923A;margin-bottom:5mm}
.nt-hd img{width:17mm;height:17mm;display:block;margin:0 auto 2.5mm}
.nt-hd b{display:block;font:600 14pt Georgia,"Times New Roman",serif;letter-spacing:2.2pt;color:#0F3D35}
.nt-hd span{display:block;margin-top:1.5mm;font-size:6.5pt;letter-spacing:3pt;color:#B8923A;font-weight:700}
.nt-meta{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm;margin-bottom:5mm}
.nt-meta small,.nt-note small{display:block;font-size:6pt;letter-spacing:1.4pt;color:#8A8A7A;margin-bottom:.6mm}
.nt-meta b{font-size:9pt;font-weight:600}
.nt table{width:100%;border-collapse:collapse}
.nt th{font-size:6pt;letter-spacing:1.4pt;color:#B8923A;text-align:right;padding:0 0 2mm;border-bottom:.3mm solid #14302A}
.nt th:first-child,.nt td:first-child{text-align:left}
.nt td{height:8mm;padding:0;text-align:right;border-bottom:.2mm solid #E6E1D3;white-space:nowrap;font-size:8.5pt}
.nt td:first-child{white-space:normal;width:44%}
.nt td div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.nt td:last-child{font-weight:600}
.nt-sum{display:grid;grid-template-columns:1fr 62mm;gap:6mm;margin-top:4mm;align-items:start}
.nt-sum p{display:flex;justify-content:space-between;margin:0 0 1.5mm;font-size:8.5pt}
.nt-sum p.tt{border-top:.3mm solid #B8923A;padding-top:2.5mm;margin-top:2mm;font:600 11pt Georgia,serif;color:#0F3D35}
.nt-sum p.tt span:first-child{font-size:7pt;letter-spacing:2pt;align-self:center}
.nt-note{font-size:8pt}
.nt-st{position:absolute;left:12mm;bottom:15mm;width:46mm}
.nt-ft{position:absolute;left:0;right:0;bottom:8mm;text-align:center;font-size:6.5pt;letter-spacing:1.2pt;color:#8A8A7A}
.nt-void{position:absolute;left:18mm;right:18mm;top:95mm;text-align:center;font:700 28pt Georgia,serif;letter-spacing:4pt;color:#C0392B;transform:rotate(-18deg);opacity:.5;border:.8mm solid #C0392B;padding:2mm 0}`;
const ntRp=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID');
const ntErr=e=>{const m=String(e?.message||e||'');return /login/i.test(m)?'Sesi berakhir, silakan masuk lagi':/^(Item|Metode)|wajib/.test(m)?m:'Nota belum dapat diproses. Coba lagi.'};
const ntTgl=(v,s)=>new Date(v).toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:s?'short':'long',year:'numeric'});
const ntJam=v=>new Date(v).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit'}).replace(':','.');
function ntHTML(n){
 const it=n.items||[];
 return `<div class="nt"><div class="nt-hd"><img src="${BRAND_LOGO}"><b>TEH SOLO MAK-GAMBRENG</b><span>NOTA DIGITAL</span></div>
<div class="nt-meta"><div><small>NO. NOTA</small><b>${esc(n.nota_number)}</b></div><div><small>TANGGAL</small><b>${ntTgl(n.issued_at)} · ${ntJam(n.issued_at)} WIB</b></div><div><small>PELANGGAN</small><b>${esc(n.customer_name)}</b></div><div><small>PEMBAYARAN</small><b>${esc(n.payment_method)}</b></div></div>
<table><tr><th>ITEM</th><th>QTY</th><th>HARGA</th><th>JUMLAH</th></tr>${it.map(r=>`<tr><td><div>${esc(r.name)}</div></td><td>${r.qty}</td><td>${ntRp(r.price)}</td><td>${ntRp(r.qty*r.price)}</td></tr>`).join('')}</table>
<div class="nt-sum">${n.notes?`<div class="nt-note"><small>CATATAN</small>${esc(n.notes)}</div>`:'<div></div>'}<div><p><span>Subtotal</span><span>${ntRp(n.subtotal)}</span></p>${Number(n.discount)>0?`<p><span>Diskon</span><span>- ${ntRp(n.discount)}</span></p>`:''}<p class="tt"><span>TOTAL</span><span>${ntRp(n.total)}</span></p></div></div>
${n.status==='batal'?'<div class="nt-void">DIBATALKAN</div>':`<img class="nt-st" src="${NT_STAMP}">`}
<div class="nt-ft">Terima kasih telah menikmati Teh Solo Mak-Gambreng</div></div>`;
}
function ntFit(){const w=document.querySelector('.nt-pv');if(!w||!w.clientWidth)return;const s=(w.clientWidth-20)/559.37;w.firstElementChild.style.cssText+=`transform:scale(${s});transform-origin:top left`;w.style.height=(793.7*s+20)+'px'}
function ntBlob(n){return new Promise((ok,no)=>{
 const d=document.createElement('div');d.innerHTML=ntHTML(n);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="559.37" height="793.7"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${NT_CSS}</style>${new XMLSerializer().serializeToString(d.firstElementChild)}</div></foreignObject></svg>`;
 const im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=1748;c.height=2480;const g=c.getContext('2d');g.fillStyle='#FBF9F4';g.fillRect(0,0,1748,2480);g.drawImage(im,0,0,1748,2480);c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',.95)};
 im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
async function ntSave(n,share,btn){
 const t=btn.textContent;btn.disabled=true;btn.textContent='Memproses…';
 try{const f=new File([await ntBlob(n)],n.nota_number+'.jpg',{type:'image/jpeg'});
  if(share&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Nota '+n.nota_number});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('Nota disimpan sebagai JPG')}
 }catch(e){if(e?.name!=='AbortError'){console.error(e);toast('JPG belum dapat dibuat. Coba lagi.')}}
 btn.disabled=false;btn.textContent=t;
}
function ntDetail(n,back){
 sheet(`${pgHead('NOTA',esc(n.nota_number),n.status==='batal'?'Nota ini sudah dibatalkan':'Siap disimpan dan dibagikan ke pelanggan')}<div class="nt-pv"><div>${ntHTML(n)}</div></div>
<div class="nt-acts"><button class="btn" id="nt-jpg">Simpan JPG</button><button class="btn ghost" id="nt-share">Bagikan</button></div>${n.status==='batal'?'':'<button class="nt-void-btn" id="nt-void">Batalkan nota</button>'}`,{back});
 ntFit();requestAnimationFrame(ntFit);
 $('#nt-jpg').onclick=e=>ntSave(n,false,e.currentTarget);$('#nt-share').onclick=e=>ntSave(n,true,e.currentTarget);
 const v=$('#nt-void');
 if(v){let t;v.onclick=async()=>{
  if(!v.classList.contains('sure')){v.classList.add('sure');v.textContent='Yakin batalkan? Ketuk sekali lagi';t=setTimeout(()=>{v.classList.remove('sure');v.textContent='Batalkan nota'},3500);return}
  clearTimeout(t);v.disabled=true;
  try{const r=await rpc('nota_void',{p_id:n.id,p_reason:null});toast('Nota dibatalkan');ntDetail(r,back)}
  catch(e){console.error(e);v.disabled=false;toast(ntErr(e))}}}
}
async function notaMenu(){

 let met='Tunai';
 sheet(`${pgHead('NOTA BARU','Buat Nota','Isi data berikut, nota langsung jadi.')}<div class="nt-hint" id="nt-no">Nomor dan tanggal nota dibuat otomatis.</div>

<label class="nt-l">Diskon <i>(Rp, boleh kosong)</i></label><input class="fld" id="nt-dis" type="number" inputmode="numeric" min="0" placeholder="0">
<label class="nt-l">Catatan <i>(boleh kosong)</i></label><input class="fld" id="nt-cat" maxlength="200" placeholder="Contoh: pesanan acara ulang tahun">
<div class="nt-total"><span>Total bayar</span><b id="nt-tot">Rp 0</b></div><button class="btn" id="nt-go">Buat Nota</button>`,{back:notaMenu});
 const rows=()=>[...document.querySelectorAll('#nt-its .nt-it')].map(d=>{const i=d.querySelectorAll('input');return{name:i[0].value.trim(),qty:parseInt(i[1].value)||0,price:i[2].value===''?null:Number(i[2].value)}});
 const calc=()=>{const s=rows().reduce((a,r)=>a+(r.name&&r.price!=null?r.qty*r.price:0),0);$('#nt-tot').textContent=ntRp(s-Math.min(Math.max(Number($('#nt-dis').value)||0,0),s))};
 const add=()=>{const all=document.querySelectorAll('#nt-its .nt-it');if(all.length>=10)return toast('Maksimal 10 item per nota');
  const d=document.createElement('div');d.className='nt-it';d.innerHTML='<input class="fld" placeholder="Nama produk" maxlength="100"><input class="fld" type="number" inputmode="numeric" min="1" value="1" aria-label="Jumlah"><input class="fld" type="number" inputmode="numeric" min="0" placeholder="Harga satuan (Rp)"><button type="button" class="x" aria-label="Hapus item">×</button>';
  d.oninput=calc;d.querySelector('.x').onclick=()=>{if(document.querySelectorAll('#nt-its .nt-it').length>1){d.remove();calc()}};$('#nt-its').appendChild(d)};
 add();$('#nt-add').onclick=add;$('#nt-dis').oninput=calc;
 document.querySelectorAll('.nt-seg [data-m]').forEach(b=>b.onclick=()=>{met=b.dataset.m;document.querySelectorAll('.nt-seg [data-m]').forEach(x=>x.classList.toggle('on',x===b))});
 rpc('nota_peek_number').then(v=>{const e=$('#nt-no');if(e&&v)e.textContent='Nomor nota berikutnya: '+v}).catch(()=>{});
 $('#nt-go').onclick=async ev=>{
  const b=ev.currentTarget,r=rows().filter(x=>x.name||x.price!=null);
  if(!r.length)return toast('Isi minimal satu item');

  if(r.some(x=>x.price==null||x.price<0))return toast('Harga item belum diisi');
  if(r.some(x=>x.qty<1))return toast('Jumlah item minimal 1');
  b.disabled=true;b.textContent='Membuat nota…';
  try{const n=await rpc('nota_create',{p_customer:$('#nt-pel').value,p_method:met,p_items:r,p_discount:Number($('#nt-dis').value)||0,p_notes:$('#nt-cat').value});toast('Nota berhasil dibuat');ntDetail(n,notaMenu)}

function bind(){document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>act(b.dataset.o))}
async function act(o){
 try{
  if(o==='out'){
    await sbClient.auth.signOut();
    if(realtimeChannel)await sbClient.removeChannel(realtimeChannel);
    realtimeChannel=null; login(); return;
  }
  if(o==='team'){teamSheet();return;}
  if(o==='gerai'){geraiSheet();return;}
  if(o==='nota'){notaMenu();return;}
  if(o==='hist'){
    const rows=state.transactions||[];
    sheet(`${pgHead('RIWAYAT PENJUALAN','History Penjualan',rows.length?rows.length+' transaksi tercatat':'Belum ada transaksi')}<div class="card">${rows.length?rows.map(x=>li('🧾',esc(x.transaction_id||'Transaksi'),`${esc(x.occurred_at||'')} · ${esc(x.payment_method||'')}`,`<span class="amt">${rp(x.total_amount)}</span>`)).join(''):'<div class="empty">Belum ada transaksi yang tercatat.</div>'}</div>`);
    return;
  }
  if(o==='tagihan'){
    TG.select=false;TG.sel=new Set();
    await tgReload();
    tagihanSheet();
    return;
  }
  if(o==='history-beli-bayar'||o==='finance'){
    sheet(`${pgHead('KEUANGAN','History Beli &amp; Bayar','Pendapatan dan aktivitas keuangan yang tercatat')}<div class="card">${state.moneyTimeline.length?state.moneyTimeline.map(x=>li('💰',esc(x.title||x.description||x.type||'Aktivitas'),esc(x.created_at||x.occurred_at||''),`<span class="amt">${rp(x.amount||x.total_amount||0)}</span>`)).join(''):'<div class="empty">Belum ada aktivitas keuangan yang memiliki catatan sumber.</div>'}</div>`);
    return;
  }
  if(o==='pengumuman'){annMenu();return;}
  if(o==='arsip'){
    const TIPE={store:'Gerai',menu:'Menu',inventory_item:'Item logistik',spg:'SPG',checker:'Checker',ice_whatsapp_contact:'Kontak WhatsApp'};
    let rows=[];
    try{rows=asArray(await selectRows('owner_deletion_log',q=>q.order('deleted_at',{ascending:false}).limit(200)))}catch(e){console.error(e);toast('Arsip riwayat belum dapat dimuat. Coba lagi.');return}
    sheet(`${pgHead('ARSIP','Arsip Riwayat Terhapus',rows.length?rows.length+' catatan tersimpan':'Belum ada data yang dihapus')}<div class="card">${rows.length?rows.map(x=>{
      const n=Object.values(x.summary||{}).reduce((a,v)=>a+Number(v||0),0);
      return li('🗄️',esc(x.entity_name||'Tanpa nama'),esc((TIPE[x.entity_type]||'Data')+' · dihapus '+fmtWaktu(x.deleted_at)),`<span class="chip">${n} catatan</span>`);
    }).join(''):'<div class="empty">Belum ada data yang dihapus.</div>'}</div>`);
    return;
  }
  if(o==='bell'){await openBell();return}
  if(o==='log-aktifitas'||o==='audit'){
    sheet(`${pgHead('AKTIVITAS','Riwayat Aktivitas','Catatan perubahan data usaha')}<div class="card">${audit.length?audit.map(a=>li('🧾',esc(auditText(a)),esc(fmtWaktu(a.created_at)),'')).join(''):'<div class="empty">Belum ada riwayat aktivitas.</div>'}</div>`);
    return;
  }
  if(o==='set-menu'||o==='menu'){menuSheet();return;}
  if(o==='spg'||o==='checker'){
    const rows=o==='spg'?state.spg:state.checker;
    sheet(`${pgHead('TIM OPERASIONAL',o==='spg'?'SPG':'Checker',rows.length+' anggota')}<div class="card">${rows.length?rows.map(x=>li(o==='spg'?'🧑':'🧑‍💼',esc(x.full_name||'Tanpa nama'),`${esc(x.phone||'Nomor belum diisi')}`,`<span class="chip ${String(x.profile_status).toLowerCase()==='active'?'ok':'warn'}">${esc(statusLabel(x.profile_status))}</span>`)).join(''):'<div class="empty">Belum ada data yang tersedia.</div>'}</div>`);
    return;
  }
  if(o==='es'){
    sheet(`${pgHead('LOGISTIK','Es Kristal',state.iceOrders.length+' pesanan tercatat')}<div class="card">${state.iceOrders.length?state.iceOrders.map(x=>li('🧊','Pesanan es',`${esc(statusLabel(x.status))} · ${esc(fmtWaktu(x.requested_at))}`,`<span class="amt">${esc(x.quantity||0)} ${esc(x.unit||'')}</span>`)).join(''):'<div class="empty">Belum ada pesanan es.</div>'}</div>`);
    return;
  }
  if(o==='report'){tab='lap';draw();return}
  if(o==='pdf'){downloadReportFlow();return}
  if(o==='kode'){
    sheet(pgHead('KEAMANAN','Ubah kode akses','')+'<div class="hint">Kode akses mengikuti kata sandi akun Owner yang tersimpan di sistem. Perubahan kode dilakukan melalui pengelolaan akun.</div>');
    return;
  }
  if(o==='hpp'){
    sheet(pgHead('DATA USAHA','Periode HPP','')+'<div class="hint">Pengaturan periode HPP belum tersedia. Tidak ada perubahan yang disimpan sampai pengaturan ini siap.</div>');
    return;
  }
  if(o==='edit'){
    sheet(pgHead('KEAMANAN','Pusat Edit Data','')+'<div class="hint">Gunakan menu Kelola Usaha untuk mengubah data utama. Perubahan langsung disimpan ke sistem.</div>');
    return;
  }
  if(o.startsWith('crud-')){crudSheet(o.replace('crud-',''));return}
  if(o==='report-period'){downloadReportFlow();return}
  if(o==='report-penjualan'){await showSalesReport();return}
  if(o.startsWith('report-')){await showReport(o.replace('report-',''));return}
  if(o==='back-reports'){closeSheet();return}
  if(o==='report-period'){downloadReportFlow();return}
  if(o==='download-report'){downloadReportFlow();return}
 }catch(e){console.error(e);toast(friendlyError(e,'Aksi belum berhasil. Coba lagi.'))}
}

async function bootOwnerApp(){
 try{
   if(!sbClient){
     document.body.classList.remove('splash-active');
     const splash=document.getElementById('elite-splash');
     if(splash) splash.remove();
     app.innerHTML=`<main class="lg" aria-label="Koneksi Owner"><section class="lg-hero"><div class="lg-brand"><div class="logo" aria-hidden="true"><img src="${BRAND_LOGO}" alt=""></div><h1>Panel Owner belum dapat dimuat</h1><p>Koneksi belum berhasil. Periksa internet Anda, lalu muat ulang halaman.</p></div></section><section class="lg-card"><div class="lg-heading"><strong>Koneksi belum siap</strong><span>Pastikan internet aktif, lalu coba lagi.</span></div><button class="btn lg-btn" onclick="location.reload()">Muat ulang</button></section></main>`;
     return;
   }
   const {data:{session}}=await sbClient.auth.getSession();
   if(session){
     await loadServerState();
     shell();
     startRealtime();
   }else{
     login();
   }
 }catch(e){
   console.error(e);
   login();
 }
}
/* Splash mengikuti seluruh rangkaian animasi desain (intro → wash → brand → coin → title → credit → exit).

setTimeout(()=>{
  document.body.classList.remove('splash-active');
  const splash=document.getElementById('elite-splash');
  if(splash){splash.setAttribute('aria-hidden','true');setTimeout(()=>splash.remove(),380)}
  bootOwnerApp();
},8300);
